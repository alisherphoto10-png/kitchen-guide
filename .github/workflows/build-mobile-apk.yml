name: Build KitchenDesk mobile APK

on:
  workflow_dispatch: {}
  push:
    branches:
      - claude/oko-waiter-guide-xlsx
    paths:
      - "oko-mobile-app/**"
      - ".github/workflows/build-mobile-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: oko-mobile-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Install npm dependencies
        run: npm install

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: oko-mobile-app/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kitchendesk-debug-apk
          path: oko-mobile-app/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
