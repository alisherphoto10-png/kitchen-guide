name: Build KitchenDesk mobile APK

on:
  workflow_dispatch: {}
  push:
    branches:
      - claude/oko-waiter-guide-xlsx
    paths:
      - "oko-mobile-app/**"
      - ".github/workflows/build-mobile-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: oko-mobile-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Install npm dependencies
        run: npm install

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: oko-mobile-app/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kitchendesk-debug-apk
          path: oko-mobile-app/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Rename APK for release
        run: cp android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/kitchendesk.apk

      # Постоянная ссылка на скачивание — один файл .apk напрямую, без
      # архива и без захода в конкретный прогон Actions. Тег
      # "mobile-test-latest" переиспользуется каждый раз (не новый релиз
      # на каждую сборку), поэтому ссылка не меняется между версиями —
      # можно один раз сохранить/закрепить и всегда скачивать оттуда же
      # актуальную сборку.
      - name: Publish to rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mobile-test-latest
          name: "KitchenDesk — тестовая сборка"
          body: "Последняя тестовая сборка мобильного приложения. Ссылка постоянная, файл каждый раз обновляется."
          files: oko-mobile-app/android/app/build/outputs/apk/debug/kitchendesk.apk
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
