          ${days.map((d) => {
            const count = data.byDay[d];
            const h = Math.max(4, Math.round((count / maxCount) * 60));
            const label = new Date(d).toLocaleDateString("ru-RU", { day: "2-digit", month: "2-digit" });
            return `<div class="guide-views-bar" title="${label}: ${count}"><div class="fill" style="height:${h}px"></div><span>${label}</span></div>`;
          }).join("")}
        </div>` : `<div class="empty-note">Пока не открывали</div>`}
    `;
  }

  // ---------- dish editor ----------
  // Единый черновик блюда: раньше каждое поле читалось прямо из DOM в
  // момент нажатия "Сохранить", а вкладки при переключении перерисовывались
  // из серверной копии — значит несохранённые правки на вкладке, с которой
  // ты просто ушёл на другую, тихо терялись (это и был баг "сохранял,
  // сохранял, а блюда нет" — скорее всего терялось переименование). Теперь
  // весь блюдо-объект живёт в dishDraft[id], поля вкладок читают/пишут
  // ТОЛЬКО туда, и "Сохранить" одной кнопкой отправляет черновик целиком —
  // неважно, на какой вкладке нажали.
  const dishDraft = {};
  let editorLocked = false;

  function ensureDraft(id) {
    if (!dishDraft[id]) {
      const d = findDish(id) || {};
      const existingAllergens = d.allergens || [];
      dishDraft[id] = {
        name: d.name || "", subtitle: d.subtitle || "", description: d.description || "",
        sectionId: d.sectionId || "", status: d.status || "", hidden: Boolean(d.hidden),
        history: d.history || "", historyQuote: d.historyQuote || "",
        servingSteps: JSON.parse(JSON.stringify(d.servingSteps || [])),
        waiterPhrase: d.waiterPhrase || "",
        recommendations: JSON.parse(JSON.stringify(d.recommendations || [])),
        features: JSON.parse(JSON.stringify(d.features || [])),
        warning: d.warning || "",
        allergensChecked: new Set(existingAllergens.filter((a) => ALLERGEN_OPTIONS.includes(a))),
        allergensOther: existingAllergens.filter((a) => !ALLERGEN_OPTIONS.includes(a)).join("\n"),
        calcTables: JSON.parse(JSON.stringify(d.calcTables || [])),
        faq: JSON.parse(JSON.stringify(d.faq || [])),
      };
    }
    return dishDraft[id];
  }
  function bindField(id, key, opts) {
    const el = document.getElementById(id);
    if (!el) return;
    const draft = ensureDraft(editingDishId);
    const handler = () => {
      if (opts && opts.checkbox) draft[key] = el.checked;
      else if (opts && opts.lines) draft[key] = linesToArray(el.value);
      else draft[key] = el.value;
      markDirty();
    };
    el.addEventListener("input", handler);
    el.addEventListener("change", handler);
  }

  async function createDish() {
    const sectionId = categoryFilter !== "all" ? categoryFilter : (sections[0] && sections[0].id) || null;
    const res = await fetch("/api/oko-waiter-guide/admin/dishes", {
      method: "POST", headers: authHeaders({ "Content-Type": "application/json" }),
      body: JSON.stringify({ name: "Новое блюдо", sectionId }),
    });
    if (!res.ok) return;
    const created = await res.json();
    await reload();
    openEditor(created.id);
  }

  function localDraftKey(id) { return "owg_admin_draft_" + id; }
  function saveDraftToLocalStorage(id) {
    if (!id || !dishDraft[id]) return;
    try {
      const draft = dishDraft[id];
      const serializable = Object.assign({}, draft, { allergensChecked: Array.from(draft.allergensChecked) });
      localStorage.setItem(localDraftKey(id), JSON.stringify(serializable));
    } catch (e) {}
  }
  function clearLocalDraft(id) {
    try { localStorage.removeItem(localDraftKey(id)); } catch (e) {}
  }

  async function openEditor(id) {
    editingDishId = id;
    activeTab = "basic";
    isDirty = false;
    editorLocked = false;
    delete dishDraft[id];
    renderMain();

    let stored = null;
    try { stored = JSON.parse(localStorage.getItem(localDraftKey(id)) || "null"); } catch (e) {}
    if (stored && editingDishId === id) {
      const keep = await draftRecoveryDialog();
      if (editingDishId !== id) return; // ушли на другой экран, пока ждали ответа
      if (keep) {
        stored.allergensChecked = new Set(stored.allergensChecked || []);
        dishDraft[id] = stored;
        markDirty();
        renderMain();
      } else {
        clearLocalDraft(id);
      }
    }
  }

  async function closeEditor() {
    if (isDirty) {
      const leave = await unsavedGuard();
      if (!leave) return;
    }
    editingDishId = null;
    renderShell();
  }
  function markDirty() {
    isDirty = true;
    const el = document.getElementById("saveIndicator");
    if (el) { el.textContent = "● Есть несохранённые изменения"; el.className = "save-indicator dirty"; }
    syncPreview();
    saveDraftToLocalStorage(editingDishId);
  }
  window.addEventListener("beforeunload", (e) => {
    if (isDirty) { e.preventDefault(); e.returnValue = ""; }
  });
  function unlockEditor() {
    editorLocked = false;
    isDirty = false;
    renderMain();
  }

  const EDITOR_TABS = [
    ["basic", "Основное"], ["composition", "Состав"], ["history", "История"],
    ["serving", "Подача"], ["important", "Важно"], ["faq", "FAQ"],
  ];

  function renderDishEditor() {
    const dish = findDish(editingDishId);
    if (!dish) { editingDishId = null; renderShell(); return; }
    setMobileBack(closeEditor);

    const main = document.getElementById("mainContent");
    const hasPhoto = dish.photos && dish.photos.length;
    main.innerHTML = `
      <div class="editor-head">
        <button class="icon-btn" onclick="closeEditor()" style="display:none" id="editorBackDesktopHidden"></button>
        ${hasPhoto ? `<img class="thumb-sm" id="editorThumb">` : `<div class="thumb-sm placeholder">${icon("photo")}</div>`}
        <div>
          <h1>${escapeHtml(dish.name) || "(без названия)"}</h1>
          <div class="sub">${escapeHtml(sectionName(dish.sectionId) || "без категории")}</div>
        </div>
        <div class="spacer"></div>
        <span class="save-indicator" id="saveIndicator"></span>
        <button class="icon-btn" onclick="openPreview('${dish.id}')" title="Предпросмотр">${icon("eye")}</button>
        <button class="icon-btn danger" onclick="deleteDish('${dish.id}')" title="Удалить">${icon("trash")}</button>
      </div>
      <div class="tabs-scroll"><div class="tabs" id="editorTabs"></div></div>
      <div id="editorPanel"></div>
      <div class="editor-footer" id="editorFooter"></div>
    `;
    renderEditorFooter(dish);
    if (hasPhoto) loadThumb(dish).then(() => { const t = document.getElementById("editorThumb"); if (t) t.src = document.getElementById(`thumb-${dish.id}`)?.src || ""; });
    if (hasPhoto) {
      const key = `${dish.id}-0`;
      const trySet = () => { const t = document.getElementById("editorThumb"); if (t && photoUrls[key]) t.src = photoUrls[key]; };
      loadThumb(dish).then(trySet);
    }

    document.getElementById("editorTabs").innerHTML = EDITOR_TABS.map(([key, label]) => `
      <button class="tab-btn ${activeTab === key ? "active" : ""}" data-tab="${key}">${label}</button>
    `).join("");
    enableWheelHorizontalScroll(document.querySelector(".tabs-scroll"));
    document.querySelectorAll("#editorTabs .tab-btn").forEach((btn) => {
      btn.addEventListener("click", () => { activeTab = btn.dataset.tab; renderEditorPanel(dish); });
    });
    renderEditorPanel(dish);
  }

  function renderEditorFooter(dish) {
    const footer = document.getElementById("editorFooter");
    if (!footer) return;
    footer.innerHTML = editorLocked
      ? `<button class="btn-ghost" onclick="openPreview('${dish.id}')">${icon("eye")}Предпросмотр</button>
         <button class="btn-accent" onclick="unlockEditor()">${icon("edit")}Редактировать</button>`
      : `<button class="btn-ghost" onclick="openPreview('${dish.id}')">${icon("eye")}Предпросмотр</button>
         <button class="btn-accent" onclick="saveDish('${dish.id}')" title="Сохраняет все вкладки блюда целиком">${icon("check")}Сохранить блюдо</button>`;
  }

  function renderEditorPanel(dish) {
    document.querySelectorAll("#editorTabs .tab-btn").forEach((b) => b.classList.toggle("active", b.dataset.tab === activeTab));
    const panel = document.getElementById("editorPanel");
    if (activeTab === "basic") panel.innerHTML = renderBasicTab(dish);
    else if (activeTab === "composition") panel.innerHTML = renderCompositionTab(dish);
    else if (activeTab === "history") panel.innerHTML = renderHistoryTab(dish);
    else if (activeTab === "serving") panel.innerHTML = renderServingTab(dish);
    else if (activeTab === "important") panel.innerHTML = renderImportantTab(dish);
    else panel.innerHTML = renderFaqTab(dish);
    panel.classList.toggle("panel-locked", editorLocked);
    wirePanelEvents(dish);
    if (editorLocked) {
      panel.querySelectorAll("input, textarea, select").forEach((el) => { el.disabled = true; });
    }
    renderEditorFooter(dish);
  }

  function renderBasicTab(dish) {
    const photos = dish.photos || [];
    const draft = ensureDraft(dish.id);
    return `
      <div class="editor-panel">
        <div class="field"><label>Фотографии</label>
          <div class="photo-grid" id="photoGrid"></div>
          <input type="file" id="photoFileInput" accept="image/*" multiple style="display:none">
          <div class="hint" style="font-size:0.719rem;color:var(--dim)">Первое фото — главное, оно используется в списке и карточке блюда. Перетаскивайте, чтобы поменять порядок.</div>
        </div>
      </div>
      <div class="editor-panel">
        <div class="field"><label>Название <span class="req">*</span></label><input type="text" id="f-name" value="${escapeHtml(draft.name)}"></div>
        <div class="field"><label>Подзаголовок</label><input type="text" id="f-subtitle" value="${escapeHtml(draft.subtitle)}"></div>
        <div class="field"><label>Краткое описание <span class="req">*</span></label><textarea id="f-description">${escapeHtml(draft.description)}</textarea></div>
        <div class="field"><label>Категория <span class="req">*</span></label>
          <select id="f-section">${sectionsTreeOrdered().map((s) => `<option value="${s.id}" ${s.id === draft.sectionId ? "selected" : ""}>${s.parentId ? "└ " : ""}${escapeHtml(s.name)}</option>`).join("")}</select>
        </div>
        <div class="field"><label>Статус</label>
          <div class="status-picker" id="statusPicker">
            ${statusOptions().map(([v, label]) => `<button type="button" class="status-pick ${v === draft.status ? "active" : ""}" data-status="${escapeHtml(v)}">${escapeHtml(label)}</button>`).join("")}
          </div>
        </div>
        <div class="field" style="display:flex;align-items:center;gap:8px">
          <input type="checkbox" id="f-hidden" ${draft.hidden ? "checked" : ""} style="width:16px;height:16px;accent-color:var(--accent)">
          <label for="f-hidden" style="margin:0">Скрыть блюдо (не показывать официантам)</label>
        </div>
      </div>
    `;
  }

  function renderCompositionTab(dish) {
    return `
      <div class="editor-panel">
        <div id="calcTablesWrap"></div>
        <button type="button" class="btn-add-row" onclick="addCalcTable('${dish.id}')">${icon("plus")} Добавить группу ингредиентов</button>
      </div>
    `;
  }

  function renderHistoryTab(dish) {
    const draft = ensureDraft(dish.id);
    return `
      <div class="editor-panel">
        <div class="field"><label>История блюда</label><textarea id="f-history" rows="4">${escapeHtml(draft.history)}</textarea></div>
        <div class="field"><label>Интересный факт (необязательно)</label><input type="text" id="f-historyQuote" value="${escapeHtml(draft.historyQuote)}"></div>
      </div>
    `;
  }

  function renderServingTab(dish) {
    const draft = ensureDraft(dish.id);
    return `
      <div class="editor-panel">
        <div class="field"><label>Как подаём</label>
          <textarea id="f-servingSteps" rows="4" placeholder="Подаётся охлаждённым&#10;Украшается микрозеленью">${arrayToLines(draft.servingSteps)}</textarea>
        </div>
        <div class="field"><label>Что сказать гостю</label><textarea id="f-waiterPhrase" rows="3">${escapeHtml(draft.waiterPhrase)}</textarea></div>
        <div class="field"><label>Рекомендации</label>
          <textarea id="f-recommendations" rows="3" placeholder="По одной на строку">${arrayToLines(draft.recommendations)}</textarea>
        </div>
      </div>
    `;
  }

  function renderImportantTab(dish) {
    const draft = ensureDraft(dish.id);
    return `
      <div class="editor-panel">
        <div class="field"><label>Аллергены</label>
          <div class="checkbox-grid" id="allergenGrid">
            ${ALLERGEN_OPTIONS.map((a) => `
              <label class="check-item ${draft.allergensChecked.has(a) ? "checked" : ""}" data-allergen="${escapeHtml(a)}">
                <input type="checkbox" ${draft.allergensChecked.has(a) ? "checked" : ""}><span>${escapeHtml(a)}</span>
              </label>`).join("")}
          </div>
          <label style="font-size:0.75rem;color:var(--dim);font-weight:600;display:block;margin-bottom:5px">Другое (по одному на строку)</label>
          <textarea id="f-allergenOther" rows="2">${escapeHtml(draft.allergensOther)}</textarea>
        </div>
        <div class="field"><label>Особенности</label>
          <textarea id="f-features" rows="3" placeholder="По одной на строку">${arrayToLines(draft.features)}</textarea>
        </div>
        <div class="field"><label>Предупреждение</label><input type="text" id="f-warning" value="${escapeHtml(draft.warning)}" placeholder="Например: не рекомендуется гостям с ослабленным иммунитетом"></div>
      </div>
    `;
  }

  function renderFaqTab(dish) {
    return `
      <div class="editor-panel">
        <div id="faqWrap"></div>
        <button type="button" class="btn-add-row" onclick="addFaqRow('${dish.id}')">${icon("plus")} Добавить вопрос</button>
      </div>
    `;
  }

  function wirePanelEvents(dish) {
    const id = dish.id;

    if (activeTab === "basic") {
      bindField("f-name", "name");
      bindField("f-subtitle", "subtitle");
      bindField("f-description", "description");
      bindField("f-section", "sectionId");
      bindField("f-hidden", "hidden", { checkbox: true });
      renderPhotoGrid(id);
      const fileInput = document.getElementById("photoFileInput");
      document.querySelectorAll("#statusPicker .status-pick").forEach((btn) => {
        btn.addEventListener("click", () => {
          if (editorLocked) return;
          document.querySelectorAll("#statusPicker .status-pick").forEach((b) => b.classList.remove("active"));
          btn.classList.add("active");
          ensureDraft(id).status = btn.dataset.status;
          markDirty();
        });
      });
      fileInput.addEventListener("change", async () => {
        for (const file of fileInput.files) {
          const dataUri = await fileToDataUri(file);
          await fetch(`/api/oko-waiter-guide/admin/dishes/${id}`, {
            method: "PATCH", headers: authHeaders({ "Content-Type": "application/json" }),
            body: JSON.stringify({ addPhoto: dataUri }),
          });
        }
        await reload();
        editingDishId = id;
        renderMain();
      });
    }
    if (activeTab === "composition") renderCalc(id);
    if (activeTab === "history") {
      bindField("f-history", "history");
      bindField("f-historyQuote", "historyQuote");
    }
    if (activeTab === "serving") {
      bindField("f-servingSteps", "servingSteps", { lines: true });
      bindField("f-waiterPhrase", "waiterPhrase");
      bindField("f-recommendations", "recommendations", { lines: true });
    }
    if (activeTab === "important") {
      bindField("f-allergenOther", "allergensOther");
      bindField("f-features", "features", { lines: true });
      bindField("f-warning", "warning");
      document.querySelectorAll("#allergenGrid .check-item").forEach((label) => {
        label.addEventListener("click", () => {
          if (editorLocked) return;
          const a = label.dataset.allergen;
          const draft = ensureDraft(id);
          if (draft.allergensChecked.has(a)) draft.allergensChecked.delete(a); else draft.allergensChecked.add(a);
          label.classList.toggle("checked", draft.allergensChecked.has(a));
          label.querySelector("input").checked = draft.allergensChecked.has(a);
          markDirty();
        });
      });
    }
    if (activeTab === "faq") renderFaq(id);
  }

  function renderPhotoGrid(dishId) {
    const dish = findDish(dishId);
    const photos = dish.photos || [];
    const wrap = document.getElementById("photoGrid");
    wrap.innerHTML = photos.map((_, i) => `
      <div class="photo-item" draggable="true" data-idx="${i}">
        <img id="editPhoto-${dishId}-${i}">
        ${i === 0 ? `<span class="main-badge">Главное</span>` : `<button type="button" class="main-btn" data-make-main="${i}">Сделать главным</button>`}
        <button type="button" class="rm-btn" data-remove="${i}">✕</button>
      </div>`).join("") + `
      <button type="button" class="photo-add" id="photoAddBtn">${icon("photo")}<span>Добавить</span></button>
    `;
    photos.forEach((p, i) => {
      fetch(`/api/oko-waiter-guide/photos/${p}`).then((r) => r.blob()).then((b) => {
        const img = document.getElementById(`editPhoto-${dishId}-${i}`);
        if (img) img.src = URL.createObjectURL(b);
      });
    });
    document.getElementById("photoAddBtn").addEventListener("click", () => document.getElementById("photoFileInput").click());
    wrap.querySelectorAll("[data-remove]").forEach((btn) => {
      btn.addEventListener("click", async (e) => {
        e.stopPropagation();
        await fetch(`/api/oko-waiter-guide/admin/dishes/${dishId}`, {
          method: "PATCH", headers: authHeaders({ "Content-Type": "application/json" }),
          body: JSON.stringify({ removePhotoIndex: Number(btn.dataset.remove) }),
        });
        await reload();
        editingDishId = dishId; renderMain();
      });
    });
    wrap.querySelectorAll("[data-make-main]").forEach((btn) => {
      btn.addEventListener("click", async (e) => {
        e.stopPropagation();
        const idx = Number(btn.dataset.makeMain);
        const order = photos.slice();
        const [item] = order.splice(idx, 1);
        order.unshift(item);
        await fetch(`/api/oko-waiter-guide/admin/dishes/${dishId}`, {
          method: "PATCH", headers: authHeaders({ "Content-Type": "application/json" }),
          body: JSON.stringify({ photosOrder: order }),
        });
        await reload();
        editingDishId = dishId; renderMain();
      });
    });
    let dragEl = null;
    wrap.querySelectorAll(".photo-item").forEach((item) => {
      item.addEventListener("dragstart", () => { dragEl = item; item.classList.add("dragging"); });
      item.addEventListener("dragend", () => { item.classList.remove("dragging"); dragEl = null; });
      item.addEventListener("dragover", (e) => {
        e.preventDefault();
        if (!dragEl || dragEl === item) return;
        const rect = item.getBoundingClientRect();
        const before = (e.clientX - rect.left) < rect.width / 2;
        item.parentNode.insertBefore(dragEl, before ? item : item.nextSibling);
      });
      item.addEventListener("drop", async () => {
        const order = Array.from(wrap.querySelectorAll(".photo-item")).map((el) => photos[Number(el.dataset.idx)]);
        await fetch(`/api/oko-waiter-guide/admin/dishes/${dishId}`, {
          method: "PATCH", headers: authHeaders({ "Content-Type": "application/json" }),
          body: JSON.stringify({ photosOrder: order }),
        });
        await reload();
        editingDishId = dishId; renderMain();
      });
    });
  }

  // ---------- composition (calc tables) ----------
  function renderCalc(dishId) {
    const tables = ensureDraft(dishId).calcTables;
    const wrap = document.getElementById("calcTablesWrap");
    wrap.innerHTML = tables.map((t, ti) => `
      <div class="repeatable-group">
        <div class="field"><input type="text" placeholder="Название группы (необязательно)" value="${escapeHtml(t.label || "")}" data-table-label="${ti}"></div>
        <div id="calcRows-${ti}"></div>
        <button type="button" class="btn-add-row" data-add-row="${ti}">${icon("plus")} Ингредиент</button>
        <button type="button" class="btn-ghost" style="margin-top:8px;color:var(--bad)" data-rm-table="${ti}">Удалить группу</button>
      </div>`).join("");

    tables.forEach((t, ti) => {
      const rowsWrap = document.getElementById(`calcRows-${ti}`);
      rowsWrap.innerHTML = t.rows.map((r, ri) => `
        <div class="repeatable-row" draggable="true" data-ti="${ti}" data-ri="${ri}">
          <span class="grip">${icon("grip")}</span>
          <input type="text" placeholder="Ингредиент" value="${escapeHtml(r.name || "")}" data-row-field="name">
          <input type="text" class="unit" placeholder="ед." value="${escapeHtml(r.unit || "")}" data-row-field="unit">
          <input type="text" class="amount" placeholder="кол-во" value="${escapeHtml(r.amount || "")}" data-row-field="amount">
          <button type="button" class="rm" data-rm-row>${icon("close")}</button>
        </div>`).join("");

      rowsWrap.querySelectorAll(".repeatable-row").forEach((rowEl) => {
        const ri = Number(rowEl.dataset.ri);
        rowEl.querySelectorAll("[data-row-field]").forEach((input) => {
          input.addEventListener("input", () => { tables[ti].rows[ri][input.dataset.rowField] = input.value; markDirty(); });
        });
        rowEl.querySelector("[data-rm-row]").addEventListener("click", () => {
          tables[ti].rows.splice(ri, 1); markDirty(); renderCalc(dishId);
        });
      });
      wireRowDrag(rowsWrap, tables[ti].rows, dishId);
    });

    wrap.querySelectorAll("[data-table-label]").forEach((input) => {
      input.addEventListener("input", () => { tables[Number(input.dataset.tableLabel)].label = input.value; markDirty(); });
    });
    wrap.querySelectorAll("[data-add-row]").forEach((btn) => {
      btn.addEventListener("click", () => {
        tables[Number(btn.dataset.addRow)].rows.push({ name: "", unit: "кг", amount: "" });
        markDirty(); renderCalc(dishId);
      });
    });
    wrap.querySelectorAll("[data-rm-table]").forEach((btn) => {
      btn.addEventListener("click", () => { tables.splice(Number(btn.dataset.rmTable), 1); markDirty(); renderCalc(dishId); });
    });
  }
  function addCalcTable(dishId) {
    ensureDraft(dishId).calcTables.push({ label: "", rows: [{ name: "", unit: "кг", amount: "" }] });
    markDirty(); renderCalc(dishId);
  }
  function wireRowDrag(rowsWrap, rowsArr, dishId) {
    let dragEl = null, dragIdx = null;
    rowsWrap.querySelectorAll(".repeatable-row").forEach((row) => {
      row.addEventListener("dragstart", () => { dragEl = row; dragIdx = Number(row.dataset.ri); row.classList.add("dragging"); });
      row.addEventListener("dragend", () => { row.classList.remove("dragging"); dragEl = null; });
      row.addEventListener("dragover", (e) => {
        e.preventDefault();
        if (!dragEl || dragEl === row) return;
        const rect = row.getBoundingClientRect();
        const before = (e.clientY - rect.top) < rect.height / 2;
        row.parentNode.insertBefore(dragEl, before ? row : row.nextSibling);
      });
      row.addEventListener("drop", () => {
        const newOrderIdx = Array.from(rowsWrap.querySelectorAll(".repeatable-row")).map((el) => Number(el.dataset.ri));
        const reordered = newOrderIdx.map((i) => rowsArr[i]);
        rowsArr.length = 0;
        reordered.forEach((r) => rowsArr.push(r));
        markDirty(); renderCalc(dishId);
      });
    });
  }

  // ---------- FAQ ----------
  function renderFaq(dishId) {
    const faq = ensureDraft(dishId).faq;
    const wrap = document.getElementById("faqWrap");
    wrap.innerHTML = faq.map((f, fi) => `
      <div class="faq-block" draggable="true" data-fi="${fi}">
        <div class="faq-top">
          <span class="grip">${icon("grip")}</span>
          <input type="text" placeholder="Вопрос" value="${escapeHtml(f.question || "")}" data-faq-field="question">
          <button type="button" class="rm" data-rm-faq>${icon("close")}</button>
        </div>
        <textarea placeholder="Ответ" rows="2" data-faq-field="answer">${escapeHtml(f.answer || "")}</textarea>
      </div>`).join("");
    wrap.querySelectorAll(".faq-block").forEach((block) => {
      const fi = Number(block.dataset.fi);
      block.querySelectorAll("[data-faq-field]").forEach((input) => {
        input.addEventListener("input", () => { faq[fi][input.dataset.faqField] = input.value; markDirty(); });
      });
      block.querySelector("[data-rm-faq]").addEventListener("click", () => { faq.splice(fi, 1); markDirty(); renderFaq(dishId); });
    });
    let dragEl = null;
    wrap.querySelectorAll(".faq-block").forEach((block) => {
      block.addEventListener("dragstart", () => { dragEl = block; block.classList.add("dragging"); });
      block.addEventListener("dragend", () => { block.classList.remove("dragging"); dragEl = null; });
      block.addEventListener("dragover", (e) => {
        e.preventDefault();
        if (!dragEl || dragEl === block) return;
        const rect = block.getBoundingClientRect();
        const before = (e.clientY - rect.top) < rect.height / 2;
        block.parentNode.insertBefore(dragEl, before ? block : block.nextSibling);
      });
      block.addEventListener("drop", () => {
        const newOrder = Array.from(wrap.querySelectorAll(".faq-block")).map((el) => faq[Number(el.dataset.fi)]);
        faq.length = 0; newOrder.forEach((f) => faq.push(f));
        markDirty(); renderFaq(dishId);
      });
    });
  }
  function addFaqRow(dishId) { ensureDraft(dishId).faq.push({ question: "", answer: "" }); markDirty(); renderFaq(dishId); }

  function fileToDataUri(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  // ---------- save / delete ----------
  // Одна кнопка "Сохранить" отправляет ВЕСЬ черновик разом (все поля со
  // всех вкладок, не только то, что видно на текущей) — раньше собирали
  // тело запроса из DOM, а DOM для невидимых вкладок не существовал, и их
  // изменения молча пропадали при сохранении с другой вкладки.
  async function saveDish(dishId) {
    const statusEl = document.getElementById("saveIndicator");
    const draft = ensureDraft(dishId);

    const body = {
      name: draft.name, subtitle: draft.subtitle, description: draft.description,
      sectionId: draft.sectionId || null, status: draft.status, hidden: draft.hidden,
      history: draft.history, historyQuote: draft.historyQuote,
      servingSteps: draft.servingSteps, waiterPhrase: draft.waiterPhrase,
      recommendations: draft.recommendations, features: draft.features, warning: draft.warning,
      allergens: [...draft.allergensChecked, ...linesToArray(draft.allergensOther)],
      calcTables: draft.calcTables,
      faq: draft.faq.filter((f) => f.question && f.question.trim()),
    };

    const res = await fetch(`/api/oko-waiter-guide/admin/dishes/${dishId}`, {
      method: "PATCH", headers: authHeaders({ "Content-Type": "application/json" }), body: JSON.stringify(body),
    });
    if (!res.ok) {
      if (statusEl) { statusEl.textContent = "Не удалось сохранить"; statusEl.className = "save-indicator dirty"; }
      return;
    }
    isDirty = false;
    // Сразу после сохранения экран "запирается" (поля недоступны для
    // правки) — по просьбе пользователя, чтобы после успешного сохранения
    // случайное нажатие/правка не могли ничего испортить. "Редактировать"
    // в футере снимает блокировку.
    editorLocked = true;
    if (statusEl) { statusEl.textContent = "✓ Изменения сохранены"; statusEl.className = "save-indicator saved"; }
    delete dishDraft[dishId];
    clearLocalDraft(dishId);
    await reload();
    editingDishId = dishId;
    renderMain();
  }

  async function deleteDish(dishId) {
    const dish = findDish(dishId);
    const ok = await confirmDialog(`Удалить «${dish.name}»?`, "Блюдо будет удалено из пособия официанта.");
    if (!ok) return;
    await fetch(`/api/oko-waiter-guide/admin/dishes/${dishId}`, { method: "DELETE", headers: authHeaders() });
    delete dishDraft[dishId];
    clearLocalDraft(dishId);
    editingDishId = null;
    isDirty = false;
    await reload();
  }

  // ---------- live preview (postMessage into the real guide app) ----------
  // Открываем настоящую страницу пособия официанта на зарезервированном
  // слаге "__preview__" и шлём ей текущий ЧЕРНОВИК (не то, что сохранено на
  // сервере) через postMessage — это гарантирует, что превью выглядит
  // 1-в-1 как у официанта (переиспользуем тот же рендер), и обновляется
  // сразу при вводе, без сохранения (см. markDirty()).
  let previewIframeEl = null;
  let previewDishId = null;

  function buildPreviewPayload(dishId) {
    const draft = ensureDraft(dishId);
    const liveDish = findDish(dishId) || {};
    const section = sections.find((s) => s.id === draft.sectionId);
    return {
      id: dishId,
      sectionName: section ? section.name : "",
      sectionSlug: section ? section.slug : "",
      name: draft.name, subtitle: draft.subtitle, description: draft.description,
      status: draft.status, hidden: draft.hidden,
      history: draft.history, historyQuote: draft.historyQuote,
      servingSteps: draft.servingSteps, waiterPhrase: draft.waiterPhrase,
      recommendations: draft.recommendations, features: draft.features, warning: draft.warning,
      allergens: [...draft.allergensChecked, ...linesToArray(draft.allergensOther)],
      calcTables: draft.calcTables,
      faq: draft.faq.filter((f) => f.question && f.question.trim()),
      photos: liveDish.photos || [],
    };
  }
  function syncPreview() {
    if (!previewIframeEl || !previewDishId) return;
    try {
      previewIframeEl.contentWindow.postMessage({ type: "oko-preview-update", dish: buildPreviewPayload(previewDishId) }, location.origin);
    } catch (e) {}
  }

  function openPreview(dishId) {
    previewDishId = dishId;
    const overlay = document.getElementById("previewOverlay");
    overlay.innerHTML = `
      <div class="preview-modal">
        <div class="phone-frame"><iframe id="previewIframe" src="/waiter-guide/dish/__preview__"></iframe></div>
        <div class="close-row"><button class="btn-ghost" id="previewCloseBtn">Закрыть</button></div>
      </div>`;
    overlay.classList.add("open");
    previewIframeEl = document.getElementById("previewIframe");
    previewIframeEl.addEventListener("load", syncPreview);
    document.getElementById("previewCloseBtn").addEventListener("click", closePreview);
    overlay.addEventListener("click", (e) => { if (e.target === overlay) closePreview(); }, { once: true });
  }
  function closePreview() {
    previewIframeEl = null;
    previewDishId = null;
    const overlay = document.getElementById("previewOverlay");
    overlay.classList.remove("open");
    setTimeout(() => { overlay.innerHTML = ""; }, 200);
  }

  // ---------- confirm modal ----------
  function confirmDialog(title, text) {
    return new Promise((resolve) => {
      const overlay = document.getElementById("confirmOverlay");
      overlay.innerHTML = `
        <div class="confirm-modal">
          <h3>${escapeHtml(title)}</h3>
          <p>${escapeHtml(text)}</p>
          <div class="row">
            <button class="btn-ghost" id="confirmCancel">Отмена</button>
            <button class="btn-accent" id="confirmOk" style="background:var(--bad);color:#fff">Удалить</button>
          </div>
        </div>`;
      overlay.classList.add("open");
      const finish = (val) => { overlay.classList.remove("open"); setTimeout(() => { overlay.innerHTML = ""; }, 200); resolve(val); };
      document.getElementById("confirmCancel").addEventListener("click", () => finish(false));
      document.getElementById("confirmOk").addEventListener("click", () => finish(true));
    });
  }

  // resolve(true) = уйти без сохранения, resolve(false) = остаться
  function unsavedGuard() {
    return new Promise((resolve) => {
      const overlay = document.getElementById("confirmOverlay");
      overlay.innerHTML = `
        <div class="confirm-modal">
          <h3>Несохранённые изменения</h3>
          <p>У вас есть несохранённые изменения.</p>
          <div class="row">
            <button class="btn-ghost" id="stayBtn">Остаться</button>
            <button class="btn-accent" id="leaveBtn">Выйти без сохранения</button>
          </div>
        </div>`;
      overlay.classList.add("open");
      const finish = (val) => { overlay.classList.remove("open"); setTimeout(() => { overlay.innerHTML = ""; }, 200); resolve(val); };
      document.getElementById("stayBtn").addEventListener("click", () => finish(false));
      document.getElementById("leaveBtn").addEventListener("click", () => finish(true));
    });
  }

  // resolve(true) = продолжить черновик, resolve(false) = удалить черновик
  function draftRecoveryDialog() {
    return new Promise((resolve) => {
      const overlay = document.getElementById("confirmOverlay");
      overlay.innerHTML = `
        <div class="confirm-modal">
          <h3>Черновик найден</h3>
          <p>Найден несохранённый черновик для этого блюда.</p>
          <div class="row">
            <button class="btn-ghost" id="discardDraftBtn">Удалить черновик</button>
            <button class="btn-accent" id="continueDraftBtn">Продолжить</button>
          </div>
        </div>`;
      overlay.classList.add("open");
      const finish = (val) => { overlay.classList.remove("open"); setTimeout(() => { overlay.innerHTML = ""; }, 200); resolve(val); };
      document.getElementById("discardDraftBtn").addEventListener("click", () => finish(false));
      document.getElementById("continueDraftBtn").addEventListener("click", () => finish(true));
    });
  }
</script>
</body>
</html>
