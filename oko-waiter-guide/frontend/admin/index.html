<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OKO — Админка</title>
<style>
  :root {
    --bg:#0f0c09; --card:#1c1712; --card2:#160f0b; --border:#2c2319; --border-soft:#221a13;
    --text:#f3ede2; --muted:#b6a993; --dim:#8a7c68; --accent:#d9a24a; --accent-soft:#241b0f;
    --bad:#e0663f; --bad-soft:rgba(224,102,63,0.14); --info:#4b9fe8; --info-soft:rgba(75,159,232,0.14);
    --gold-text:#f0d9a8;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { font-size: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(120% 50% at 50% 0%, rgba(217,162,74,0.05), transparent 60%), var(--bg);
    color: var(--text); margin: 0; -webkit-font-smoothing: antialiased;
  }
  button, input, textarea, select { font-family: inherit; }
  h1, h2, h3, h4, h5 { margin: 0; }
  button { cursor: pointer; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 8px; }

  /* ---------- gate ---------- */
  #gate {
    min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  .gate-card {
    width: 100%; max-width: 340px; background: var(--card); border: 1px solid var(--border); border-radius: 20px;
    padding: 28px 24px; text-align: center;
  }
  .gate-card .wordmark { font-size: 1.375rem; font-weight: 800; letter-spacing: 0.03em; margin-bottom: 2px; }
  .gate-card .tagline { font-size: 0.75rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); margin-bottom: 22px; }
  .gate-card input {
    width: 100%; background: rgba(255,255,255,0.06); border: 1px solid var(--border); border-radius: 12px;
    padding: 12px 14px; color: var(--text); font-size: 0.938rem; margin-bottom: 12px;
  }
  .gate-card input:focus { outline: none; border-color: var(--accent); }
  .btn-primary {
    width: 100%; background: var(--accent); color: #1a1108; border: none; border-radius: 100px;
    padding: 12px; font-size: 0.906rem; font-weight: 800;
  }
  .status-msg { font-size: 0.813rem; margin-top: 10px; min-height: 16px; }
  .status-msg.error { color: var(--bad); }
  .status-msg.ok { color: var(--accent); }

  .settings-media-row { display: flex; gap: 14px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border); }
  .settings-media-row:last-of-type { border-bottom: none; }
  .settings-media-preview { width: 68px; height: 68px; border-radius: 12px; object-fit: cover; background: var(--card2); border: 1px solid var(--border); flex: none; }
  .settings-media-info { flex: 1; min-width: 0; }
  .settings-media-title { font-weight: 700; font-size: 0.875rem; margin-bottom: 3px; }
  .settings-media-hint { font-size: 0.75rem; color: var(--dim); margin-bottom: 8px; line-height: 1.4; }

  /* ---------- shell ---------- */
  #app { display: none; min-height: 100vh; }
  .admin-shell { display: flex; min-height: 100vh; }
  .admin-sidebar {
    width: 240px; flex: none; background: var(--card2); border-right: 1px solid var(--border);
    display: flex; flex-direction: column; padding: 22px 16px; position: sticky; top: 0; height: 100vh;
  }
  .sidebar-brand { text-align: center; margin-bottom: 26px; }
  .sidebar-brand .wordmark { font-size: 1.25rem; font-weight: 800; letter-spacing: 0.03em; }
  .sidebar-brand .tagline { font-size: 0.688rem; color: var(--accent); text-transform: uppercase; letter-spacing: 0.08em; margin-top: 2px; }
  .sidebar-brand .sub { font-size: 0.688rem; color: var(--dim); margin-top: 1px; }
  .sidebar-nav { display: flex; flex-direction: column; gap: 4px; }
  .nav-item {
    display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; background: none; border: none;
    color: var(--muted); padding: 11px 12px; border-radius: 12px; font-size: 0.875rem; font-weight: 600;
  }
  .nav-item svg { width: 18px; height: 18px; flex: none; }
  .nav-item .nav-count { margin-left: auto; font-size: 0.719rem; color: var(--dim); font-weight: 700; }
  .nav-item.active { background: var(--accent); color: #1a1108; }
  .nav-item.active .nav-count { color: rgba(26,17,8,0.65); }
  .nav-item:not(.active):hover { background: rgba(255,255,255,0.05); }
  .sidebar-footer { margin-top: auto; }
  .sidebar-stats { display: flex; gap: 8px; margin-bottom: 16px; }
  .sidebar-stat { flex: 1; background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 10px; text-align: center; }
  .sidebar-stat .num { font-size: 1.25rem; font-weight: 800; color: var(--gold-text); }
  .sidebar-stat .lbl { font-size: 0.656rem; color: var(--dim); text-transform: uppercase; letter-spacing: 0.04em; margin-top: 2px; }

  .guide-views-chart { display: flex; align-items: flex-end; gap: 4px; height: 90px; padding: 0 2px; overflow-x: auto; }
  .guide-views-bar { flex: 1 0 20px; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; min-width: 20px; }
  .guide-views-bar .fill { width: 100%; background: var(--accent); border-radius: 4px 4px 0 0; min-height: 4px; }
  .guide-views-bar span { font-size: 0.563rem; color: var(--dim); margin-top: 4px; white-space: nowrap; }
  .btn-logout {
    width: 100%; background: none; border: 1px solid var(--border); color: var(--muted); border-radius: 12px;
    padding: 10px; font-size: 0.813rem; font-weight: 600;
  }

  .admin-main { flex: 1; min-width: 0; padding: 24px 28px 60px; max-width: 980px; }

  /* ---------- mobile top bar ---------- */
  .mobile-topbar { display: none; }
  .mobile-menu-btn { display: none; }
  @media (max-width: 1023px) {
    .admin-sidebar { display: none; }
    .admin-main { position: relative; isolation: isolate; overflow: clip; }
    .mobile-hero-photo {
      position: absolute; top: 0; left: 0; right: 0; height: 640px; z-index: -1; pointer-events: none;
      background-image: url('../hero/hero-1.jpg'); background-size: cover; background-position: center 22%;
      filter: blur(4px); transform: scale(1.04);
    }
    .mobile-hero-photo::after {
      content: ""; position: absolute; inset: 0;
      background: linear-gradient(180deg, rgba(15,12,9,0.32) 0%, rgba(15,12,9,0.55) 42%, rgba(15,12,9,0.2) 62%, var(--bg) 100%);
    }
    .mobile-topbar {
      display: flex; align-items: center; gap: 10px; position: sticky; top: 0; z-index: 10;
      background: rgba(15,12,9,0.4); backdrop-filter: blur(16px) saturate(1.2); -webkit-backdrop-filter: blur(16px) saturate(1.2);
      border-bottom: 1px solid rgba(255,255,255,0.07); padding: 12px 16px;
    }
    .mobile-topbar .wordmark { font-weight: 800; font-size: 0.938rem; }
    .mobile-topbar .tagline { font-size: 0.594rem; color: var(--dim); text-transform: uppercase; letter-spacing: 0.06em; }
    .mobile-topbar .spacer { flex: 1; }
    .mobile-menu-btn { display: flex; }
    .admin-main { padding: 18px 16px 90px; max-width: 100%; }

    .view-head { margin: -18px -16px 18px; padding: 22px 16px 18px; }
  }

  /* ---------- mobile side nav drawer ---------- */
  .mobile-nav-backdrop {
    position: fixed; inset: 0; z-index: 65; background: rgba(0,0,0,0);
    opacity: 0; pointer-events: none; transition: opacity 220ms ease, background 220ms ease;
  }
  .mobile-nav-backdrop.open { background: rgba(0,0,0,0.6); opacity: 1; pointer-events: auto; }
  .mobile-nav-drawer {
    position: fixed; top: 0; right: 0; height: 100%; width: 78%; max-width: 300px; z-index: 66;
    background: var(--card); border-left: 1px solid var(--border); box-shadow: -12px 0 32px rgba(0,0,0,0.35);
    padding: 18px 16px calc(18px + env(safe-area-inset-bottom, 0px));
    display: flex; flex-direction: column; overflow-y: auto;
    transform: translateX(100%); transition: transform 260ms cubic-bezier(0.16,1,0.3,1);
  }
  .mobile-nav-drawer.open { transform: translateX(0); }
  .mobile-nav-drawer .drawer-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .mobile-nav-drawer .drawer-head .wordmark { font-weight: 800; font-size: 1.05rem; }
  .mobile-nav-drawer .drawer-head .tagline { font-size: 0.625rem; color: var(--accent); text-transform: uppercase; letter-spacing: 0.06em; }
  .mobile-nav-drawer .sidebar-nav { margin-bottom: 8px; }
  .mobile-nav-drawer .sidebar-footer { margin-top: auto; padding-top: 14px; }

  .icon-btn {
    width: 38px; height: 38px; border-radius: 12px; background: var(--card); border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center; color: var(--text); flex: none;
  }
  .icon-btn svg { width: 18px; height: 18px; }
  .icon-btn.danger { color: var(--bad); }

  /* ---------- generic view header ---------- */
  .view-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 18px; flex-wrap: wrap; }
  .view-head h1 { font-size: 1.375rem; font-weight: 800; }
  .view-head .hint { font-size: 0.813rem; color: var(--dim); margin-top: 3px; }
  .btn-accent {
    display: inline-flex; align-items: center; gap: 6px; background: var(--accent); color: #1a1108; border: none;
    border-radius: 100px; padding: 10px 16px; font-size: 0.844rem; font-weight: 800; white-space: nowrap;
  }
  .btn-accent svg { width: 15px; height: 15px; }
  .btn-ghost {
    display: inline-flex; align-items: center; gap: 6px; background: rgba(255,255,255,0.06); color: var(--text);
    border: 1px solid var(--border); border-radius: 100px; padding: 10px 16px; font-size: 0.844rem; font-weight: 700;
  }

  /* ---------- search + filters ---------- */
  .search-box { position: relative; margin-bottom: 14px; }
  .search-box input {
    width: 100%; background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 11px 14px 11px 38px; color: var(--text); font-size: 0.875rem;
  }
  .search-box input:focus { outline: none; border-color: var(--accent); }
  .search-box .ic { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--dim); }
  .search-box .ic svg { width: 16px; height: 16px; }

  .chip-row { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 16px; }
  .chip-row::-webkit-scrollbar { height: 6px; }
  .filter-chip {
    flex: none; background: var(--card); border: 1px solid var(--border); color: var(--muted); border-radius: 100px;
    padding: 8px 14px; font-size: 0.781rem; font-weight: 700;
  }
  .filter-chip.active { background: var(--accent); border-color: var(--accent); color: #1a1108; }

  /* ---------- dish list ---------- */
  .dish-grid { display: flex; flex-direction: column; gap: 10px; }
  .dish-row-card {
    display: flex; align-items: center; gap: 12px; background: var(--card); border: 1px solid var(--border);
    border-radius: 14px; padding: 10px 12px; text-align: left; width: 100%;
  }
  .dish-row-card .thumb { width: 48px; height: 48px; border-radius: 10px; object-fit: cover; background: var(--card2); flex: none; }
  .dish-row-card .thumb.placeholder { display: flex; align-items: center; justify-content: center; color: var(--dim); }
  .dish-row-card .thumb.placeholder svg { width: 18px; height: 18px; }
  .dish-row-card .body { flex: 1; min-width: 0; }
  .dish-row-card .top { display: flex; align-items: center; gap: 6px; }
  .dish-row-card .name { font-weight: 700; font-size: 0.906rem; color: var(--gold-text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dish-row-card .name.hidden-flag { color: var(--dim); text-decoration: line-through; }
  .dish-row-card .cat { font-size: 0.719rem; color: var(--accent); margin-top: 1px; }
  .dish-row-card .status-tag { flex: none; font-size: 0.688rem; font-weight: 700; color: var(--gold-text); }
  .dish-row-card .chev { flex: none; color: var(--dim); }
  .dish-row-card .chev svg { width: 16px; height: 16px; }
  .empty-note { text-align: center; padding: 40px 20px; color: var(--dim); font-size: 0.875rem; }

  /* ---------- categories view ---------- */
  .cat-row {
    display: flex; align-items: center; flex-wrap: wrap; gap: 10px; background: var(--card); border: 1px solid var(--border);
    border-radius: 14px; padding: 10px 12px; margin-bottom: 8px; cursor: grab;
  }
  .cat-row.dragging, .cat-group.dragging { opacity: 0.4; }
  .cat-row .grip { color: var(--dim); font-size: 1rem; line-height: 1; flex: none; }
  .cat-row .icon-chip {
    width: 36px; height: 36px; border-radius: 10px; background: var(--card2); display: flex; align-items: center;
    justify-content: center; color: var(--gold-text); flex: none; overflow: hidden;
  }
  .cat-row .icon-chip svg { width: 17px; height: 17px; }
  .cat-row .icon-chip img { width: 100%; height: 100%; object-fit: cover; }
  .cat-row .info { flex: 1 1 140px; min-width: 140px; }
  .cat-row .name { font-weight: 700; font-size: 0.875rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cat-row .count { font-size: 0.719rem; color: var(--dim); }
  .cat-row-extra { display: flex; align-items: center; gap: 6px; margin-left: auto; flex: none; }
  .cat-row .cat-actions { display: flex; gap: 4px; flex: none; }
  .cat-row .cat-actions button { width: 32px; height: 32px; border-radius: 9px; background: var(--card2); border: 1px solid var(--border); color: var(--muted); }
  .cat-row .cat-actions button svg { width: 14px; height: 14px; }
  .cat-row .cat-actions button.has-note { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }

  .subsections { margin: 6px 0 10px 20px; padding-left: 14px; border-left: 2px solid var(--border); }
  .subsections .cat-row { padding: 8px 10px; margin-bottom: 6px; cursor: default; }
  .subsections .cat-row .icon-chip { width: 28px; height: 28px; }
  .subsections .cat-row .icon-chip svg { width: 13px; height: 13px; }
  .btn-add-subsection {
    background: none; border: 1px dashed var(--border); color: var(--dim); border-radius: 10px;
    padding: 7px 12px; font-size: 0.75rem; font-weight: 700; width: 100%;
  }
  .quick-add-row { display: flex; gap: 8px; margin-top: 8px; }
  .quick-add-row input { flex: 1; background: rgba(255,255,255,0.05); border: 1px solid var(--border); border-radius: 10px; padding: 8px 10px; color: var(--text); font-size: 0.813rem; }

  .status-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .status-row .emoji-input { width: 52px; text-align: center; flex: none; }
  .status-row .label-input { flex: 1; }
  .status-row input { background: rgba(255,255,255,0.05); border: 1px solid var(--border); border-radius: 10px; padding: 8px 10px; color: var(--text); font-size: 0.813rem; }

  .xlsx-preview-scroll { max-height: 320px; overflow: auto; border: 1px solid var(--border); border-radius: 10px; }
  .xlsx-preview-table { border-collapse: collapse; font-size: 0.719rem; white-space: nowrap; }
  .xlsx-preview-table th, .xlsx-preview-table td { padding: 6px 8px; border-bottom: 1px solid var(--border-soft); text-align: left; }
  .xlsx-preview-table th { position: sticky; top: 0; background: var(--card2); color: var(--dim); font-weight: 700; z-index: 1; }
  .xlsx-preview-table tbody tr:hover { background: rgba(255,255,255,0.04); }

  .cat-form {
    background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 16px; margin-bottom: 18px;
  }
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 0.75rem; color: var(--dim); margin-bottom: 5px; font-weight: 600; }
  .field .req { color: var(--bad); }
  .field input[type=text], .field input[type=search], .field textarea, .field select {
    width: 100%; background: rgba(255,255,255,0.05); border: 1px solid var(--border); border-radius: 11px;
    padding: 10px 12px; color: var(--text); font-size: 0.875rem;
  }
  .field textarea { resize: vertical; min-height: 64px; }
  .field input:focus, .field textarea:focus, .field select:focus { outline: none; border-color: var(--accent); }
  /* Раскрытый список <select> — браузер рисует его сам поверх системной
     (обычно белой) подложки и не наследует наш тёмный фон; без явного
     background/color на <option> текст оказывается светло-серым на белом
     и почти не виден. */
  .field select option { background: #1c1712; color: var(--text); }
  .field .char-count { text-align: right; font-size: 0.688rem; color: var(--dim); margin-top: 3px; }

  .icon-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(52px, 1fr)); gap: 8px; margin-bottom: 12px; }
  .icon-pick {
    aspect-ratio: 1; border-radius: 11px; background: rgba(255,255,255,0.05); border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center; color: var(--muted);
  }
  .icon-pick svg { width: 18px; height: 18px; }
  .icon-pick.active { background: var(--accent); border-color: var(--accent); color: #1a1108; }

  /* ---------- dish editor ---------- */
  .editor-head {
    display: flex; align-items: center; gap: 10px; margin-bottom: 16px; flex-wrap: wrap;
  }
  .editor-head .thumb-sm { width: 44px; height: 44px; border-radius: 10px; object-fit: cover; background: var(--card2); flex: none; }
  .editor-head .thumb-sm.placeholder { display: flex; align-items: center; justify-content: center; color: var(--dim); }
  .editor-head .thumb-sm.placeholder svg { width: 18px; height: 18px; }
  .editor-head h1 { font-size: 1.125rem; max-width: 320px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .editor-head .sub { font-size: 0.75rem; color: var(--dim); }
  .editor-head .spacer { flex: 1; }
  .save-indicator { font-size: 0.75rem; font-weight: 700; white-space: nowrap; }
  .save-indicator.dirty { color: var(--accent); }
  .save-indicator.saved { color: #8fbf7a; }

  .tabs-scroll { overflow-x: auto; margin-bottom: 18px; padding-bottom: 6px; }
  .tabs-scroll::-webkit-scrollbar { height: 6px; }
  .tabs { display: flex; gap: 4px; background: var(--card2); border: 1px solid var(--border); border-radius: 100px; padding: 3px; width: max-content; min-width: 100%; }
  .tab-btn {
    flex: none; background: none; border: none; color: var(--dim); font-size: 0.813rem; font-weight: 700;
    padding: 9px 16px; border-radius: 100px; white-space: nowrap;
  }
  .tab-btn.active { background: var(--accent); color: #1a1108; }

  .editor-panel { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 18px; margin-bottom: 16px; }
  #editorPanel.panel-locked { pointer-events: none; opacity: 0.62; user-select: none; }

  .status-picker { display: flex; gap: 8px; flex-wrap: wrap; }
  .status-pick {
    background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: var(--muted); border-radius: 100px;
    padding: 8px 14px; font-size: 0.813rem; font-weight: 700;
  }
  .status-pick.active { background: var(--accent); border-color: var(--accent); color: #1a1108; }

  .photo-grid { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
  .photo-item { position: relative; width: 84px; height: 84px; border-radius: 12px; overflow: hidden; border: 1px solid var(--border); cursor: grab; }
  .photo-item.dragging { opacity: 0.4; }
  .photo-item img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .photo-item .main-badge {
    position: absolute; top: 4px; left: 4px; background: var(--accent); color: #1a1108; font-size: 0.594rem;
    font-weight: 800; padding: 2px 6px; border-radius: 100px;
  }
  .photo-item .rm-btn {
    position: absolute; top: 4px; right: 4px; width: 20px; height: 20px; border-radius: 50%; background: rgba(15,12,9,0.75);
    color: var(--bad); border: none; font-size: 0.75rem; line-height: 1;
  }
  .photo-item .main-btn {
    position: absolute; bottom: 4px; left: 4px; right: 4px; background: rgba(15,12,9,0.75); color: var(--text);
    border: none; border-radius: 6px; font-size: 0.563rem; padding: 3px; font-weight: 700;
  }
  .photo-add {
    width: 84px; height: 84px; border-radius: 12px; border: 1px dashed var(--border); background: rgba(255,255,255,0.03);
    display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--dim); gap: 4px;
    font-size: 0.625rem; text-align: center; flex: none;
  }
  .photo-add svg { width: 20px; height: 20px; }

  .repeatable-group { border: 1px dashed var(--border); border-radius: 12px; padding: 12px; margin-bottom: 10px; }
  .repeatable-row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; cursor: grab; }
  .repeatable-row.dragging { opacity: 0.4; }
  .repeatable-row .grip { color: var(--dim); flex: none; }
  .repeatable-row input { flex: 1; background: rgba(255,255,255,0.05); border: 1px solid var(--border); border-radius: 9px; padding: 8px 10px; color: var(--text); font-size: 0.813rem; }
  .repeatable-row input.amount { flex: 0 0 72px; }
  .repeatable-row input.unit { flex: 0 0 58px; }
  .repeatable-row button.rm { flex: none; width: 30px; height: 30px; border-radius: 8px; background: var(--card2); border: 1px solid var(--border); color: var(--bad); }

  .faq-block { border: 1px dashed var(--border); border-radius: 12px; padding: 12px; margin-bottom: 10px; }
  .faq-block .faq-top { display: flex; gap: 8px; margin-bottom: 8px; }
  .faq-block input, .faq-block textarea { flex: 1; background: rgba(255,255,255,0.05); border: 1px solid var(--border); border-radius: 9px; padding: 8px 10px; color: var(--text); font-size: 0.813rem; }
  .faq-block button.rm { flex: none; width: 30px; height: 30px; border-radius: 8px; background: var(--card2); border: 1px solid var(--border); color: var(--bad); }

  .btn-add-row {
    background: rgba(255,255,255,0.05); border: 1px dashed var(--border); color: var(--gold-text); border-radius: 10px;
    padding: 9px 14px; font-size: 0.813rem; font-weight: 700; width: 100%;
  }

  .checkbox-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 8px; margin-bottom: 12px; }
  .check-item {
    display: flex; align-items: center; gap: 8px; background: rgba(255,255,255,0.04); border: 1px solid var(--border);
    border-radius: 10px; padding: 8px 10px; font-size: 0.813rem; color: var(--muted);
  }
  .check-item input { accent-color: var(--accent); width: 16px; height: 16px; flex: none; }
  .check-item.checked { color: var(--text); border-color: var(--accent); background: var(--accent-soft); }

  .editor-footer { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  @media (max-width: 1023px) {
    .editor-footer {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: rgba(15,12,9,0.96);
      backdrop-filter: blur(10px); border-top: 1px solid var(--border);
      padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px));
    }
  }

  .modal-overlay {
    position: fixed; inset: 0; z-index: 60; background: rgba(0,0,0,0); pointer-events: none; opacity: 0;
    display: flex; align-items: center; justify-content: center; padding: 20px;
    transition: opacity 200ms ease, background 200ms ease;
  }
  .modal-overlay.open { background: rgba(0,0,0,0.65); pointer-events: auto; opacity: 1; }
  .preview-modal { background: var(--card2); border: 1px solid var(--border); border-radius: 20px; padding: 14px; max-width: 420px; width: 100%; }
  .preview-modal .phone-frame { border-radius: 28px; overflow: hidden; border: 6px solid #000; background: #000; }
  .preview-modal iframe { width: 100%; height: 70vh; border: none; display: block; background: var(--bg); }
  .preview-modal .close-row { display: flex; justify-content: flex-end; margin-top: 10px; }

  .confirm-modal { background: var(--card); border: 1px solid var(--border); border-radius: 18px; padding: 20px; max-width: 360px; width: 100%; max-height: 86vh; overflow-y: auto; }
  .confirm-modal p { font-size: 0.875rem; color: var(--muted); line-height: 1.5; margin: 8px 0 16px; }
  .confirm-modal .row { display: flex; gap: 10px; }
  .confirm-modal button { flex: 1; }
</style>
</head>
<body>

<div id="gate">
  <div class="gate-card">
    <div class="wordmark">OKO</div>
    <div class="tagline">Админка</div>
    <input type="text" id="loginInput" placeholder="Логин (оставьте пустым, если вы владелец)" onkeydown="if(event.key==='Enter') document.getElementById('passwordInput').focus()" autocomplete="username">
    <input type="password" id="passwordInput" placeholder="Пароль" onkeydown="if(event.key==='Enter') tryLogin()" autocomplete="current-password">
    <button class="btn-primary" onclick="tryLogin()">Войти</button>
    <div class="status-msg error" id="gateStatus"></div>
  </div>
</div>

<div id="app">
  <div class="admin-shell">
    <aside class="admin-sidebar">
      <div class="sidebar-brand">
        <div class="wordmark">OKO</div>
        <div class="tagline" id="sidebarBrandTag">Админка</div>
        <div class="sub">Пособие официанта</div>
      </div>
      <nav class="sidebar-nav" id="sidebarNav"></nav>
      <div class="sidebar-footer">
        <div class="sidebar-stats">
          <div class="sidebar-stat"><div class="num" id="statDishes">0</div><div class="lbl">Блюд</div></div>
          <div class="sidebar-stat"><div class="num" id="statCats">0</div><div class="lbl">Категорий</div></div>
        </div>
        <button class="btn-logout" onclick="logout()">Выйти</button>
      </div>
    </aside>
    <main class="admin-main">
      <div class="mobile-hero-photo"></div>
      <div class="mobile-topbar">
        <button class="icon-btn" id="mobileBackBtn" style="display:none"></button>
        <div>
          <div class="wordmark">OKO</div>
          <div class="tagline">Админка</div>
        </div>
        <div class="spacer"></div>
        <button class="icon-btn mobile-menu-btn" onclick="openMobileNav()" title="Меню">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
      </div>
      <div id="mainContent"></div>
    </main>
  </div>
</div>

<div class="mobile-nav-backdrop" id="mobileNavBackdrop" onclick="closeMobileNav()"></div>
<div class="mobile-nav-drawer" id="mobileNavDrawer"></div>

<div class="modal-overlay" id="previewOverlay"></div>
<div class="modal-overlay" id="confirmOverlay"></div>

<script>
  let password = sessionStorage.getItem("owg_admin_password") || "";
  let login = sessionStorage.getItem("owg_admin_login") || "";
  let allowedGroups = null; // null у владельца (видит всё без фильтра)
  let sections = [];
  let dishes = [];
  let orphans = [];
  let statuses = [];
  const photoUrls = {};

  // state
  let currentView = "dishes"; // "dishes" | "categories"
  let categoryFilter = "all";
  let searchQuery = "";
  let editingDishId = null; // null = list view
  let activeTab = "basic";
  let isDirty = false;
  let accessScope = "all"; // "all" (владелец/управляющий) | "bar" (ограниченный доступ)

  const ICONS = {
    all: '<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',
    cutlery: '<path d="M7 2v8M5 2v5a2 2 0 0 0 4 0V2M7 10v12"/><path d="M17 2c-1.7 0-3 2-3 5s1.3 5 3 5v10"/>',
    salad: '<path d="M12 21a8 8 0 0 0 8-8H4a8 8 0 0 0 8 8Z"/><path d="M12 13V7"/><path d="M12 7c-2-1-2-4 0-5 2 1 2 4 0 5Z"/>',
    hot: '<path d="M12 2s-6 5.5-6 11a6 6 0 0 0 12 0c0-2-1-3-1-3s0 2-1.5 2C14 10 15 6 12 2Z"/>',
    soup: '<path d="M3 12h18a7 7 0 0 1-14 0Z"/><path d="M12 12V9M9 6c0-1 .7-1.5.7-2.5S9 2 9 2M14 6c0-1 .7-1.5.7-2.5S14 2 14 2"/>',
    meat: '<path d="M15 13a5 5 0 1 0-6-6c-2 1-6 5-6 8a4 4 0 0 0 4 4c3 0 7-4 8-6Z"/><path d="M17.5 6.5 21 3"/>',
    pasta: '<path d="M4 6c3 0 3 3 6 3s3-3 6-3 3 3 6 3" /><path d="M4 12c3 0 3 3 6 3s3-3 6-3 3 3 6 3"/><path d="M4 18c3 0 3 3 6 3s3-3 6-3 3 3 6 3"/>',
    pizza: '<path d="M12 2 2 20h20L12 2Z"/><circle cx="12" cy="14" r="1"/><circle cx="9" cy="17" r="1"/><circle cx="15" cy="17" r="1"/>',
    skewer: '<path d="M3 12h18"/><circle cx="7" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="17" cy="12" r="2"/>',
    sushi: '<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3.2"/>',
    bread: '<rect x="3" y="9" width="18" height="10" rx="4"/><path d="M7 9V7a5 5 0 0 1 10 0v2M8 13v3M12 13v3M16 13v3"/>',
    dessert: '<path d="M4 20 12 4l8 16Z"/><circle cx="12" cy="9" r="1.4"/>',
    drink: '<path d="M8 3h8l-1 12a3 3 0 0 1-6 0L8 3Z"/><path d="M6.5 8h11M12 15v6M9 21h6"/>',
    beer: '<path d="M6 9h9v9a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V9Z"/><path d="M15 11h2a2 2 0 0 1 0 4h-2M8 6c0-1.5 1-2 1-3M11 6c0-1.5 1-2 1-3"/>',
    sauce: '<path d="M12 3c2 3 5 6.5 5 10a5 5 0 0 1-10 0c0-3.5 3-7 5-10Z"/>',
    search: '<circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/>',
    back: '<path d="M15 6 9 12l6 6"/>',
    close: '<path d="M18 6 6 18M6 6l12 12"/>',
    chev: '<path d="m9 6 6 6-6 6"/>',
    plus: '<path d="M12 5v14M5 12h14"/>',
    trash: '<path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0-1 14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2L4 6h16Z"/>',
    edit: '<path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4Z"/>',
    eye: '<path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/><circle cx="12" cy="12" r="3"/>',
    photo: '<rect x="3" y="4" width="18" height="16" rx="2.5"/><circle cx="8.5" cy="10" r="1.7"/><path d="m21 16-5-5-6 6"/>',
    dishes: '<path d="M7 2v8M5 2v5a2 2 0 0 0 4 0V2M7 10v12"/><path d="M17 2c-1.7 0-3 2-3 5s1.3 5 3 5v10"/>',
    folder: '<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/>',
    settings: '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/>',
    grip: '<circle cx="8" cy="6" r="1.3"/><circle cx="8" cy="12" r="1.3"/><circle cx="8" cy="18" r="1.3"/><circle cx="16" cy="6" r="1.3"/><circle cx="16" cy="12" r="1.3"/><circle cx="16" cy="18" r="1.3"/>',
    check: '<path d="M4 12l5 5 11-11"/>',
    warning: '<path d="M12 3 2 20h20L12 3Z"/><path d="M12 10v5M12 18v.01"/>',
    menu: '<path d="M4 6h16M4 12h16M4 18h16"/>',
    coldcup: '<path d="M12 11V6"/><circle cx="12" cy="4.3" r="1.6"/><path d="M4 12h16a8 8 0 0 1-16 0Z"/>',
    drumstick: '<path d="M8 19a5.2 5.2 0 0 1 0-10.4c1 0 1.8.3 2.5.8a4.2 4.2 0 0 1 5.8 5.8c-1.5 2.5-5 3.8-8.3 3.8Z"/><path d="M15 8.5 19.5 4"/><path d="M18 3l2.5 2.5"/>',
    note: '<path d="M4 4a2 2 0 0 1 2-2h7l7 7v11a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2Z"/><path d="M13 2v7h7"/><path d="M8 13h8M8 17h5"/>',
  };
  function icon(name) {
    return `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICONS[name] || ICONS.cutlery}</svg>`;
  }

  const SECTION_ICONS = ["cutlery","salad","coldcup","hot","soup","meat","drumstick","pasta","pizza","skewer","sushi","bread","dessert","drink","beer","sauce"];
  // Статусы ("Хит", "Популярное" и т.п.) — управляемый список из
  // data/statuses.json (карточка "Статусы блюд" на вкладке "Категории"), не
  // зашиты в код. statuses[] грузится в reload(); "" всегда доступен как
  // "нет статуса".
  function statusOptions() {
    return [["", "○ Без статуса"]].concat(statuses.map((s) => [s.id, `${s.emoji} ${s.label}`.trim()]));
  }
  function statusLabel(id) {
    const s = statuses.find((x) => x.id === id);
    return s ? `${s.emoji} ${s.label}`.trim() : "";
  }
  const ALLERGEN_OPTIONS = [
    "Глютен (пшеница, злаки)", "Яйца", "Молочные продукты", "Рыба", "Ракообразные / морепродукты",
    "Арахис", "Орехи", "Соя", "Кунжут", "Сельдерей", "Горчица", "Сульфиты", "Сырое мясо / рыба",
  ];

  // Ряды категорий/вкладок скроллятся только по горизонтали, но мышиное
  // колесо на компьютере по умолчанию крутит вертикально — без этого их
  // нечем было проскроллить, кроме тачпада с горизонтальным жестом.
  function enableWheelHorizontalScroll(el) {
    if (!el || el._wheelBound) return;
    el._wheelBound = true;
    el.addEventListener("wheel", (e) => {
      if (el.scrollWidth <= el.clientWidth) return;
      e.preventDefault();
      el.scrollLeft += e.deltaY;
    }, { passive: false });
  }

  function escapeHtml(value) {
    return String(value || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
  function linesToArray(text) {
    return String(text || "").split("\n").map((s) => s.trim()).filter(Boolean);
  }
  function arrayToLines(arr) { return (arr || []).join("\n"); }
  function authHeaders(extra) {
    return Object.assign({ "X-Admin-Password": password, "X-Admin-Login": login }, extra || {});
  }
  function isMobile() { return window.innerWidth < 1024; }
  // Владелец ("all") и сотрудник с ролью "both" (allowedGroups содержит и
  // кухню, и бар) видит обе зоны и может выбирать, куда положить новую
  // категорию; сотрудник с одной ролью — группа навязывается сервером.
  function canPickGroup() { return accessScope === "all" || (allowedGroups && allowedGroups.length > 1); }

  // ---------- auth ----------
  async function tryLogin() {
    password = document.getElementById("passwordInput").value;
    login = document.getElementById("loginInput").value.trim();
    const res = await fetch("/api/oko-waiter-guide/admin/whoami", { headers: authHeaders() });
    if (!res.ok) {
      document.getElementById("gateStatus").innerText = "Неверный логин или пароль";
      return;
    }
    const who = await res.json();
    accessScope = who.scope;
    allowedGroups = who.allowedGroups;
    sessionStorage.setItem("owg_admin_password", password);
    sessionStorage.setItem("owg_admin_login", login);
    enterApp(who.name);
  }
  function logout() {
    sessionStorage.removeItem("owg_admin_password");
    sessionStorage.removeItem("owg_admin_login");
    location.reload();
  }
  let brandTagline = "Админка";
  async function enterApp(name) {
    document.getElementById("gate").style.display = "none";
    document.getElementById("app").style.display = "block";
    brandTagline = accessScope === "all" ? "Админка" : `Админка — ${name || "сотрудник"}`;
    document.getElementById("sidebarBrandTag").textContent = brandTagline;
    await reload();
  }
  if (password || login) {
    fetch("/api/oko-waiter-guide/admin/whoami", { headers: authHeaders() }).then(async (res) => {
      if (res.ok) {
        const who = await res.json();
        accessScope = who.scope;
        allowedGroups = who.allowedGroups;
        enterApp(who.name);
      }
    });
  }

  // ---------- data ----------
  async function reload() {
    const [sRes, dRes, oRes, stRes] = await Promise.all([
      fetch("/api/oko-waiter-guide/admin/sections", { headers: authHeaders() }),
      fetch("/api/oko-waiter-guide/admin/dishes", { headers: authHeaders() }),
      fetch("/api/oko-waiter-guide/admin/orphan-dishes", { headers: authHeaders() }),
      fetch("/api/oko-waiter-guide/admin/statuses", { headers: authHeaders() }),
    ]);
    sections = (await sRes.json()).sort((a, b) => (a.order || 0) - (b.order || 0));
    dishes = await dRes.json();
    orphans = await oRes.json();
    statuses = stRes.ok ? (await stRes.json()).sort((a, b) => (a.order || 0) - (b.order || 0)) : [];
    renderShell();
  }
  function dishesFor(sectionId) {
    return dishes.filter((d) => d.sectionId === sectionId).sort((a, b) => (a.order || 0) - (b.order || 0));
  }
  function findDish(id) { return dishes.find((d) => d.id === id) || orphans.find((d) => d.id === id); }
  function topLevelSections() { return sections.filter((s) => !s.parentId); }
  function subsectionsOf(id) { return sections.filter((s) => s.parentId === id); }
  // Раздел сразу за своими подразделами — для плоских мест вроде <select>
  // категории в форме блюда, где вся иерархия — один список.
  function sectionsTreeOrdered() {
    const out = [];
    topLevelSections().forEach((s) => { out.push(s); subsectionsOf(s.id).forEach((sub) => out.push(sub)); });
    return out;
  }
  // «Родитель · Подраздел» для блюда, заведённого в подраздел — иначе просто
  // имя раздела.
  function sectionName(id) {
    const s = sections.find((x) => x.id === id);
    if (!s) return "";
    if (!s.parentId) return s.name;
    const parent = sections.find((x) => x.id === s.parentId);
    return parent ? `${parent.name} · ${s.name}` : s.name;
  }

  function matchesSearch(dish, q) {
    if (!q) return true;
    const ingredientNames = (dish.calcTables || []).flatMap((t) => t.rows.map((r) => r.name)).join(" ");
    const hay = [dish.name, dish.subtitle, dish.description, sectionName(dish.sectionId), ingredientNames].join(" ").toLowerCase();
    return hay.includes(q.toLowerCase());
  }

  // ---------- shell / nav ----------
  function navItemsHtml(closeDrawer) {
    const after = closeDrawer ? "; closeMobileNav()" : "";
    return `
      <button class="nav-item ${currentView === "dishes" ? "active" : ""}" onclick="switchView('dishes')${after}">
        ${icon("dishes")}<span>Блюда</span><span class="nav-count">${dishes.length}</span>
      </button>
      <button class="nav-item ${currentView === "categories" ? "active" : ""}" onclick="switchView('categories')${after}">
        ${icon("folder")}<span>Категории</span><span class="nav-count">${sections.length}</span>
      </button>
      <button class="nav-item ${currentView === "settings" ? "active" : ""}" onclick="switchView('settings')${after}">
        ${icon("settings")}<span>Настройки</span>
      </button>
      ${accessScope === "all" ? `
        <button class="nav-item ${currentView === "users" ? "active" : ""}" onclick="switchView('users')${after}">
          ${icon("edit")}<span>Пользователи</span>
        </button>
        <button class="nav-item ${currentView === "activity" ? "active" : ""}" onclick="switchView('activity')${after}">
          ${icon("check")}<span>Активность</span>
        </button>
      ` : ""}
    `;
  }

  function renderShell() {
    document.getElementById("statDishes").textContent = dishes.length;
    document.getElementById("statCats").textContent = sections.length;
    document.getElementById("sidebarNav").innerHTML = navItemsHtml(false);
    renderMain();
  }

  async function switchView(view) {
    if (editingDishId && isDirty) {
      const leave = await unsavedGuard();
      if (!leave) return;
    }
    currentView = view;
    editingDishId = null;
    isDirty = false;
    renderShell();
  }

  function openMobileNav() {
    const drawer = document.getElementById("mobileNavDrawer");
    drawer.innerHTML = `
      <div class="drawer-head">
        <div><div class="wordmark">OKO</div><div class="tagline">${brandTagline}</div></div>
        <button class="icon-btn" onclick="closeMobileNav()">${icon("close")}</button>
      </div>
      <nav class="sidebar-nav">${navItemsHtml(true)}</nav>
      <div class="sidebar-footer">
        <div class="sidebar-stats">
          <div class="sidebar-stat"><div class="num">${dishes.length}</div><div class="lbl">Блюд</div></div>
          <div class="sidebar-stat"><div class="num">${sections.length}</div><div class="lbl">Категорий</div></div>
        </div>
        <button class="btn-logout" onclick="logout()">Выйти</button>
      </div>
    `;
    document.getElementById("mobileNavBackdrop").classList.add("open");
    drawer.classList.add("open");
  }
  function closeMobileNav() {
    document.getElementById("mobileNavBackdrop").classList.remove("open");
    document.getElementById("mobileNavDrawer").classList.remove("open");
  }

  function setMobileBack(handler) {
    const btn = document.getElementById("mobileBackBtn");
    if (handler) {
      btn.style.display = "flex";
      btn.innerHTML = icon("back");
      btn.onclick = handler;
    } else {
      btn.style.display = "none";
      btn.onclick = null;
    }
  }

  function renderMain() {
    if (editingDishId) {
      renderDishEditor();
    } else if (currentView === "categories") {
      setMobileBack(() => switchView("dishes"));
      renderCategoriesView();
    } else if (currentView === "settings") {
      setMobileBack(() => switchView("dishes"));
      renderSettingsView();
    } else if (currentView === "users") {
      setMobileBack(() => switchView("dishes"));
      renderUsersView();
    } else if (currentView === "activity") {
      setMobileBack(() => switchView("dishes"));
      renderActivityView();
    } else {
      setMobileBack(null);
      renderDishesView();
    }
  }

  // ---------- dishes list ----------
  function renderDishesView() {
    const main = document.getElementById("mainContent");
    const pool = categoryFilter === "all" ? dishes : dishesFor(categoryFilter);
    const filtered = pool.filter((d) => matchesSearch(d, searchQuery));

    main.innerHTML = `
      <div class="view-head">
        <div>
          <h1>Блюда</h1>
          <div class="hint">Управление меню и контентом для пособия официанта</div>
        </div>
        <div style="display:flex;gap:8px">

    `;

    const chips = [{ id: "all", name: "Все блюда" }].concat(sectionsTreeOrdered().map((s) => ({ id: s.id, name: (s.parentId ? "└ " : "") + s.name })));
    document.getElementById("catChipRow").innerHTML = chips.map((c) => `
      <button class="filter-chip ${categoryFilter === c.id ? "active" : ""}" onclick="setCategoryFilter('${c.id}')">${escapeHtml(c.name)}</button>
    `).join("");
    enableWheelHorizontalScroll(document.getElementById("catChipRow"));

    const grid = document.getElementById("dishGrid");
    grid.innerHTML = filtered.length ? filtered.map(renderDishRowCard).join("") : `<div class="empty-note">Ничего не нашли</div>`;
    grid.querySelectorAll("[data-dish-id]").forEach((el) => {
      el.addEventListener("click", () => openEditor(el.dataset.dishId));
    });
    filtered.forEach(loadThumb);

    if (orphans.length) {
      const og = document.getElementById("orphanGrid");
      og.innerHTML = orphans.map(renderDishRowCard).join("");
      og.querySelectorAll("[data-dish-id]").forEach((el) => el.addEventListener("click", () => openEditor(el.dataset.dishId)));
      orphans.forEach(loadThumb);
    }

    const searchInput = document.getElementById("dishSearchInput");
    searchInput.addEventListener("input", () => {
      searchQuery = searchInput.value;
      const pool2 = categoryFilter === "all" ? dishes : dishesFor(categoryFilter);
      const filtered2 = pool2.filter((d) => matchesSearch(d, searchQuery));
      const grid2 = document.getElementById("dishGrid");
      grid2.innerHTML = filtered2.length ? filtered2.map(renderDishRowCard).join("") : `<div class="empty-note">Ничего не нашли</div>`;
      grid2.querySelectorAll("[data-dish-id]").forEach((el) => el.addEventListener("click", () => openEditor(el.dataset.dishId)));
      filtered2.forEach(loadThumb);
    });
  }

  function setCategoryFilter(id) { categoryFilter = id; renderDishesView(); }

  // ---------- экспорт/импорт блюд через Excel ----------
  async function downloadExportXlsx(btn) {
    btn.disabled = true;
    const originalText = btn.innerHTML;
    btn.innerHTML = "Готовлю…";
    try {
      const res = await fetch("/api/oko-waiter-guide/admin/export-xlsx", { headers: authHeaders() });
      if (!res.ok) throw new Error("Не удалось скачать");
      const blob = await res.blob();
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `oko-blyuda-${new Date().toISOString().slice(0, 10)}.xlsx`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 2000);
    } catch (e) {
      alert("Не удалось скачать файл");
    } finally {
      btn.disabled = false;
      btn.innerHTML = originalText;
    }
  }

  function truncate(text, n) {
    const s = String(text || "").trim();
    return s.length > n ? s.slice(0, n).trim() + "…" : s;
  }

  // Тот же порядок колонок и та же логика "раздел/подраздел родителя", что
  // и на реальном экспорте (buildDishesWorkbook на сервере) — здесь просто
  // строим её из уже загруженных в админке sections/dishes/statuses, без
  // похода на сервер, поэтому открывается мгновенно. Одна строка на блюдо
  // (не на ингредиент, как в самом файле) — для предпросмотра важнее охватить
  // все блюда разом, чем показать раскладку по строкам таблицы.
  function buildExportPreviewRows() {
    // dishes уже содержит ВСЕ блюда, включая те, что без раздела (orphans —
    // то же самое подмножество, отдельно только для своей подсветки в
    // "Без категории") — конкатенировать их значит задвоить orphans.
    return dishes.map((d) => {
      const section = sections.find((s) => s.id === d.sectionId);
      const parent = section && section.parentId ? sections.find((s) => s.id === section.parentId) : null;
      const status = statuses.find((s) => s.id === d.status);
      const ingredientCount = (d.calcTables || []).reduce((n, t) => n + (t.rows || []).length, 0);
      return {
        sectionName: parent ? parent.name : (section ? section.name : ""),
        subsectionName: parent ? section.name : "",
        name: d.name,
        status: status ? `${status.emoji} ${status.label}`.trim() : "",
        hidden: d.hidden ? "да" : "",
        subtitle: truncate(d.subtitle, 30),
        description: truncate(d.description, 40),
        ingredientCount,
        allergensCount: (d.allergens || []).length,
        faqCount: (d.faq || []).length,
      };
    });
  }

  function toggleXlsxPreview(btn) {
    const wrap = document.getElementById("xlsxPreviewWrap");
    if (wrap.style.display !== "none") { wrap.style.display = "none"; btn.innerText = "Предпросмотр — что уйдёт в файл"; return; }

    const rows = buildExportPreviewRows();
    const cols = [
      ["Раздел", "sectionName"], ["Подраздел", "subsectionName"], ["Название", "name"],
      ["Статус", "status"], ["Скрыто", "hidden"], ["Подзаголовок", "subtitle"], ["Описание", "description"],
      ["Ингредиентов", "ingredientCount"], ["Аллергенов", "allergensCount"], ["FAQ", "faqCount"],
    ];
    wrap.innerHTML = rows.length ? `
      <p class="hint" style="margin:10px 0 6px">
        ${rows.length} ${rows.length === 1 ? "блюдо" : "блюд"} — по строке на блюдо (в самом файле состав разворачивается построчно на ингредиент).
        Текстовые поля обрезаны для читаемости, в файле — целиком.
      </p>
      <div class="xlsx-preview-scroll">
        <table class="xlsx-preview-table">
          <thead><tr>${cols.map(([label]) => `<th>${escapeHtml(label)}</th>`).join("")}</tr></thead>
          <tbody>
            ${rows.map((r) => `<tr>${cols.map(([, key]) => `<td>${escapeHtml(r[key])}</td>`).join("")}</tr>`).join("")}
          </tbody>
        </table>
      </div>` : `<p class="hint">Блюд пока нет — экспортировать нечего.</p>`;
    wrap.style.display = "block";
    btn.innerText = "Скрыть предпросмотр";
  }

  function openXlsxDialog() {
    const overlay = document.getElementById("confirmOverlay");
    overlay.innerHTML = `
      <div class="confirm-modal">
        <h3>Блюда — таблица Excel</h3>
        <p class="hint">Скачайте текущие блюда таблицей, отредактируйте (или добавьте новые строки по тому же образцу) и загрузите обратно — существующие блюда обновятся, новые заведутся. Ничего не удаляется само.</p>
        <button class="btn-accent" id="xlsxDownloadBtn" style="width:100%;justify-content:center">${icon("photo")}Скачать таблицу (.xlsx)</button>
        <button class="btn-ghost" id="xlsxPreviewBtn" style="width:100%;justify-content:center;margin-top:8px">${icon("eye")}Предпросмотр — что уйдёт в файл</button>
        <div id="xlsxPreviewWrap" style="display:none"></div>
        <div style="height:14px"></div>
        <p class="hint">Загрузить заполненный файл обратно:</p>
        <input type="file" id="xlsxFileInput" accept=".xlsx">
        <button class="btn-accent" id="xlsxUploadBtn" style="width:100%;justify-content:center;margin-top:8px">Загрузить таблицу</button>
        <div id="xlsxResult"></div>
        <div class="row" style="margin-top:14px">
          <button class="btn-ghost" id="xlsxClose" style="flex:1">Закрыть</button>
        </div>
      </div>`;
    overlay.classList.add("open");
    function closeDialog() {
      overlay.classList.remove("open");
      setTimeout(() => { overlay.innerHTML = ""; }, 200);
    }
    document.getElementById("xlsxClose").addEventListener("click", closeDialog);
    document.getElementById("xlsxDownloadBtn").addEventListener("click", (e) => downloadExportXlsx(e.currentTarget));
    document.getElementById("xlsxPreviewBtn").addEventListener("click", (e) => toggleXlsxPreview(e.currentTarget));
    document.getElementById("xlsxUploadBtn").addEventListener("click", async () => {
      const fileInput = document.getElementById("xlsxFileInput");
      const resultEl = document.getElementById("xlsxResult");
      const file = fileInput.files[0];
      if (!file) { resultEl.className = "status-msg error"; resultEl.innerText = "Выберите файл"; return; }
      resultEl.className = "status-msg";
      resultEl.innerText = "Загружаю…";
      const fileBase64 = await fileToDataUri(file);
      const res = await fetch("/api/oko-waiter-guide/admin/import-xlsx", {
        method: "POST", headers: authHeaders({ "Content-Type": "application/json" }), body: JSON.stringify({ fileBase64 }),
      });
      const data = await res.json();
      if (!res.ok) { resultEl.className = "status-msg error"; resultEl.innerText = data.error || "Не удалось загрузить"; return; }
      resultEl.className = "status-msg ok";
      let text = `Готово: создано ${data.created}, обновлено ${data.updated}.`;
      if (data.skippedSheets && data.skippedSheets.length) text += ` Пропущены листы (не трогали): ${data.skippedSheets.join(", ")}.`;
      if (data.warnings && data.warnings.length) text += ` ⚠ ${data.warnings.join("; ")}`;
      resultEl.innerText = text;
      await reload();
      renderDishesView();
    });
  }

  async function loadThumb(dish) {
    if (!dish.photos || !dish.photos.length) return;
    const key = `${dish.id}-0`;
    if (!photoUrls[key]) {
      const res = await fetch(`/api/oko-waiter-guide/photos/${dish.photos[0]}`);
      if (!res.ok) return;
      photoUrls[key] = URL.createObjectURL(await res.blob());
    }
    const img = document.getElementById(`thumb-${dish.id}`);
    if (img) img.src = photoUrls[key];

  // ---------- categories view ----------

      </div>
      <div id="catList"></div>
      <div class="cat-form" id="statusesCard"></div>

    grid.querySelectorAll(".icon-pick").forEach((btn) => {

    const list = document.getElementById("catList");

    // insertBefore при перетаскивании легко воткнёт соседний раздел МЕЖДУ

    list.innerHTML = topLevelSections().map((s) => `
      <div class="cat-group" draggable="true" data-cat-id="${s.id}">

          <div class="info"><div class="name">${escapeHtml(s.name)}</div><div class="count">${dishesFor(s.id).length} блюд</div></div>
          <div class="cat-row-extra">
            ${canPickGroup() ? `<span class="status-tag">${s.group === "bar" ? "Бар" : "Кухня"}</span>` : ""}
            <div class="cat-actions">

        <div class="subsections">

            <div class="cat-row" data-cat-id="${sub.id}">
              <div class="icon-chip">${sub.photo ? `<img src="/api/oko-waiter-guide/photos/${sub.photo}" alt="">` : icon(sub.icon || "cutlery")}</div>
              <div class="info"><div class="name">${escapeHtml(sub.name)}</div><div class="count">${dishesFor(sub.id).length} блюд</div></div>
              <div class="cat-row-extra">

                  <button class="${sub.note ? "has-note" : ""}" onclick="editCategoryNoteDialog('${sub.id}')" title="Текстовый блок">${icon("note")}</button>

          <div id="addSub-${s.id}"></div>

  // Подраздел — раздел с parentId, один уровень вложенности (см. серверную
  // addSection). Переставляется отдельными ↑/↓ (не общий drag&drop списка
  // верхнего уровня), но тем же /sections/reorder — он умеет переставлять
  // произвольное подмножество разделов, не трогая остальные.
  function toggleAddSubsectionRow(parentId) {
    const el = document.getElementById(`addSub-${parentId}`);
    if (el.innerHTML) { el.innerHTML = ""; return; }
    el.innerHTML = `
      <div class="quick-add-row">
        <input type="text" id="newSubName-${parentId}" placeholder="Название подраздела">
        <button class="btn-accent" onclick="createSubsection('${parentId}')">Создать</button>
      </div>
      <div class="status-msg" id="newSubStatus-${parentId}"></div>
    `;
    document.getElementById(`newSubName-${parentId}`).focus();
  }
  async function createSubsection(parentId) {
    const input = document.getElementById(`newSubName-${parentId}`);
    const statusEl = document.getElementById(`newSubStatus-${parentId}`);
    if (!input.value.trim()) { statusEl.className = "status-msg error"; statusEl.innerText = "Укажите название"; return; }
    const res = await fetch("/api/oko-waiter-guide/admin/sections", {
      method: "POST", headers: authHeaders({ "Content-Type": "application/json" }),
      body: JSON.stringify({ name: input.value, parentId }),
    });
    if (!res.ok) { statusEl.className = "status-msg error"; statusEl.innerText = "Не удалось создать"; return; }
    await reload();
  }
  async function moveSubsection(id, delta) {
    const sub = sections.find((s) => s.id === id);
    if (!sub) return;
    const siblings = subsectionsOf(sub.parentId).map((s) => s.id);
    const i = siblings.indexOf(id);
    const j = i + delta;
    if (j < 0 || j >= siblings.length) return;
    [siblings[i], siblings[j]] = [siblings[j], siblings[i]];
    await fetch("/api/oko-waiter-guide/admin/sections/reorder", {
      method: "POST", headers: authHeaders({ "Content-Type": "application/json" }), body: JSON.stringify({ orderedIds: siblings }),
    });
    await reload();
  }

  // ---------- статусы блюд (🔥 Хит и т.п.) ----------
  function renderStatusesCard() {
    const wrap = document.getElementById("statusesCard");
    if (!wrap) return;
    wrap.innerHTML = `
      <div class="view-head" style="margin-bottom:12px"><div><h1 style="font-size:1.05rem">Статусы блюд</h1><div class="hint">Бейджи вроде «🔥 Хит» — свои, можно добавлять и переименовывать. Удаление статуса не удаляет блюда — у них просто снимается этот статус.</div></div></div>
      <div id="statusesList"></div>
      <div class="status-row">
        <input type="text" class="emoji-input" id="newStatusEmoji" placeholder="🔥">
        <input type="text" class="label-input" id="newStatusLabel" placeholder="Название, например: Хит">
        <button class="btn-accent" onclick="addStatus()">${icon("plus")}</button>
      </div>
      <div class="status-msg" id="statusesStatus"></div>
    `;
    document.getElementById("statusesList").innerHTML = statuses.length ? statuses.map((s) => `
      <div class="status-row">
        <input type="text" class="emoji-input" value="${escapeHtml(s.emoji)}" onchange="saveStatusField('${s.id}', 'emoji', this.value)">
        <input type="text" class="label-input" value="${escapeHtml(s.label)}" onchange="saveStatusField('${s.id}', 'label', this.value)">
        <button class="icon-btn danger" style="width:32px;height:32px;border-radius:9px" onclick="removeStatus('${s.id}')" title="Удалить">${icon("trash")}</button>
      </div>`).join("") : `<p class="hint">Статусов пока нет.</p>`;
  }
  async function saveStatusField(id, field, value) {
    await fetch(`/api/oko-waiter-guide/admin/statuses/${id}`, {
      method: "PATCH", headers: authHeaders({ "Content-Type": "application/json" }), body: JSON.stringify({ [field]: value }),
    });
    await reload();
  }
  async function addStatus() {
    const emojiInput = document.getElementById("newStatusEmoji");
    const labelInput = document.getElementById("newStatusLabel");
    const statusEl = document.getElementById("statusesStatus");
    if (!labelInput.value.trim()) { statusEl.className = "status-msg error"; statusEl.innerText = "Укажите название статуса"; return; }
    const res = await fetch("/api/oko-waiter-guide/admin/statuses", {
      method: "POST", headers: authHeaders({ "Content-Type": "application/json" }),
      body: JSON.stringify({ emoji: emojiInput.value, label: labelInput.value }),
    });
    if (!res.ok) { statusEl.className = "status-msg error"; statusEl.innerText = "Не удалось добавить"; return; }
    await reload();
  }
  async function removeStatus(id) {
    const ok = await confirmDialog("Удалить статус?", "У блюд с этим статусом он просто снимется.");
    if (!ok) return;
    await fetch(`/api/oko-waiter-guide/admin/statuses/${id}`, { method: "DELETE", headers: authHeaders() });
    await reload();
  }

  async function toggleCategoryGroup(id) {
    const section = sections.find((s) => s.id === id);
    const nextGroup = section.group === "bar" ? "kitchen" : "bar";
    await fetch(`/api/oko-waiter-guide/admin/sections/${id}`, {
      method: "PATCH", headers: authHeaders({ "Content-Type": "application/json" }), body: JSON.stringify({ group: nextGroup }),
    });
    await reload();
  }

  // Драг-юнит — .cat-group (раздел верхнего уровня ВМЕСТЕ со своим блоком
  // подразделов), не сам .cat-row — иначе строку соседнего раздела можно
  // вставить между чужой строкой и её же подразделами, оторвав их от
  // родителя. Подразделы внутри .subsections в этом drag&drop не участвуют
  // вовсе — у них свои кнопки ↑/↓ (moveSubsection).
  function wireCategoryDrag(list) {
    let dragEl = null;
    list.querySelectorAll(".cat-group").forEach((group) => {
      group.addEventListener("dragstart", (e) => {
        if (e.target.closest(".subsections")) { e.preventDefault(); return; }
        dragEl = group; group.classList.add("dragging");
      });
      group.addEventListener("dragend", () => { group.classList.remove("dragging"); dragEl = null; });
      group.addEventListener("dragover", (e) => {
        e.preventDefault();
        if (!dragEl || dragEl === group) return;
        const rect = group.getBoundingClientRect();
        const before = (e.clientY - rect.top) < rect.height / 2;
        group.parentNode.insertBefore(dragEl, before ? group : group.nextSibling);
      });
      group.addEventListener("drop", async () => {
        const ordered = Array.from(list.querySelectorAll(".cat-group")).map((g) => g.dataset.catId);
        await fetch("/api/oko-waiter-guide/admin/sections/reorder", {
          method: "POST", headers: authHeaders({ "Content-Type": "application/json" }),
          body: JSON.stringify({ orderedIds: ordered }),
        });
        await reload();
      });
    });
  }

            <button class="btn-accent" id="editUserSave">Сохранить</button>
          </div>
        </div>`;
      overlay.classList.add("open");
      let pickedRole = user.role;
      document.querySelectorAll("#editUserRolePicker .status-pick").forEach((btn) => {
        btn.addEventListener("click", () => {
          pickedRole = btn.dataset.role;
          document.querySelectorAll("#editUserRolePicker .status-pick").forEach((b) => b.classList.toggle("active", b === btn));
        });
      });
      const finish = (val) => { overlay.classList.remove("open"); setTimeout(() => { overlay.innerHTML = ""; }, 200); resolve(val); };
      document.getElementById("editUserCancel").addEventListener("click", () => finish(null));
      document.getElementById("editUserSave").addEventListener("click", () => {
        const name = document.getElementById("editUserName").value.trim();
        const login2 = document.getElementById("editUserLogin").value.trim();
        const pw = document.getElementById("editUserPassword").value;
        if (!name) { document.getElementById("editUserStatus").className = "status-msg error"; document.getElementById("editUserStatus").innerText = "Укажите имя"; return; }

        const patch = { name, login: login2, role: pickedRole };

        finish(patch);
