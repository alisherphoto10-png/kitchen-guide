<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#15110f">
<title>Заказ продуктов</title>
<style>
  /* Тёплая тёмная палитра (правка 2026-09-30): фон — тёплый уголь, а не
     чёрно-зелёный; акцент — медовый янтарь, перекликается с тёплым светом
     баннерных фото; зелёный остался только для «Заказ отправлен». */
  :root {
    --bg: #15110f;
    --surface: #211b18;
    --surface-2: #2b2420;
    --line: #3a302a;
    --text: #f5efe8;
    --muted: #b5a99d;
    --faint: #7f7368;
    --accent: #e6a656;
    --accent-press: #d4944a;
    --accent-ink: #2b1905;
    --accent-soft: rgba(230, 166, 86, 0.13);
    --accent-line: rgba(230, 166, 86, 0.5);
    --ok: #9fc690;
    --danger: #ef7064;
    --radius: 18px;
    --gutter: 18px;
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    font-size: 16px; line-height: 1.4; min-height: 100vh; overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; border: none; background: none; padding: 0; cursor: pointer; touch-action: manipulation; }
  input, textarea { font: inherit; color: inherit; }
  .screen { display: none; min-height: 100vh; padding-bottom: calc(120px + var(--safe-bottom)); animation: fadeIn .2s ease; }
  .screen.active { display: block; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .wrap { padding: 0 var(--gutter); max-width: 600px; margin: 0 auto; }

  /* ── Шапка: высокое фото заведения, логотип и название внутри фото ── */
  .hero {
    position: relative; overflow: hidden; isolation: isolate;
    height: clamp(300px, 46vh, 440px); display: flex; align-items: flex-end;
  }
  .hero-bg { position: absolute; inset: 0; z-index: -1; }
  .hero-bg img {
    width: 100%; height: 100%; object-fit: cover; object-position: center 40%;
    transform: scale(1.06); filter: blur(1.5px) saturate(1.05) brightness(.82);
  }
  .hero-bg.placeholder {
    background:
      radial-gradient(70% 60% at 85% 20%, rgba(230, 166, 86, .30), transparent 70%),
      radial-gradient(60% 55% at 10% 75%, rgba(196, 96, 64, .22), transparent 70%),
      linear-gradient(160deg, #2a1f18 0%, #1a1411 60%, var(--bg) 100%);
  }
  .hero-bg::after {
    content: ""; position: absolute; inset: 0;
    background:
      linear-gradient(180deg, rgba(21, 17, 15, .45) 0%, rgba(21, 17, 15, 0) 22%),
      linear-gradient(180deg, rgba(21, 17, 15, 0) 34%, rgba(21, 17, 15, .6) 62%, rgba(21, 17, 15, .88) 84%, var(--bg) 100%);
  }
  .hero-content { width: 100%; padding-bottom: 30px; }
  .brand { display: flex; align-items: center; gap: 16px; }
  .logo {
    width: 72px; height: 72px; border-radius: 20px; flex: none; overflow: hidden;
    background: #0e0b0a; box-shadow: 0 10px 30px rgba(0, 0, 0, .45), 0 0 0 1px rgba(255, 255, 255, .10);
    display: flex; align-items: center; justify-content: center;
  }
  .logo img { width: 100%; height: 100%; object-fit: cover; }
  .brand-text { min-width: 0; }
  .brand-text .kicker {
    font-size: 12px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase;
    color: rgba(245, 239, 232, .78);
  }
  .brand-text h1 {
    margin: 4px 0 0; font-size: clamp(30px, 8.4vw, 48px); line-height: 1.02; font-weight: 800;
    letter-spacing: -.02em; color: #fff; word-break: break-word;
    text-shadow: 0 2px 18px rgba(0, 0, 0, .45);
  }

  /* ── Панель под шапкой: дата и поиск ── */
  .toolbar { display: grid; gap: 12px; margin-top: 4px; }
  .date-card {
    position: relative; display: flex; align-items: center; gap: 14px; width: 100%;
    padding: 14px 16px; border-radius: var(--radius); background: var(--surface); border: 1px solid var(--line);
  }
  .date-card .ic {
    width: 44px; height: 44px; border-radius: 14px; flex: none; display: flex; align-items: center; justify-content: center;
    background: var(--accent-soft); color: var(--accent);
  }
  .date-card .lbl { font-size: 13px; color: var(--muted); }
  .date-card .val { font-size: 18px; font-weight: 700; margin-top: 1px; }
  .date-card .val::first-letter { text-transform: uppercase; }
  .date-card .change { margin-left: auto; font-size: 14px; font-weight: 600; color: var(--accent); }
  .date-card input, .row-date input {
    position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer;
    color-scheme: dark; border: 0; padding: 0; margin: 0;
  }

  .search {
    display: flex; align-items: center; gap: 10px; padding: 0 14px; height: 52px;
    background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
  }
  .search:focus-within { border-color: var(--accent-line); }
  .search input { flex: 1; min-width: 0; background: none; border: none; outline: none; font-size: 16px; height: 100%; }
  .search input::placeholder { color: var(--faint); }
  .search input::-webkit-search-cancel-button { display: none; }
  .search .clear { display: none; color: var(--muted); padding: 6px; }
  .search.has-text .clear { display: block; }
  .top-bar .search { margin: 10px 0 14px; }

  .section-head { display: flex; align-items: baseline; justify-content: space-between; margin: 26px 0 12px; }
  .section-head h3 { margin: 0; font-size: 20px; font-weight: 750; letter-spacing: -.01em; }
  .section-head span { font-size: 14px; color: var(--muted); }

  /* ── Категории: фото или значок по смыслу, не буква ── */
  .cat-list { display: grid; gap: 12px; }
  .cat {
    display: flex; align-items: center; gap: 16px; width: 100%; text-align: left;
    padding: 10px 16px 10px 10px; border-radius: var(--radius); background: var(--surface);
    border: 1px solid var(--line); transition: border-color .15s, background .15s, transform .1s;
  }
  .cat:active { transform: scale(.99); background: var(--surface-2); }
  .cat.has-picked { border-color: var(--accent-line); }
  .cat .media { width: 84px; height: 72px; border-radius: 14px; flex: none; overflow: hidden; }
  .cat .meta { flex: 1; min-width: 0; }
  .cat .name { font-size: 18px; font-weight: 700; letter-spacing: -.005em; }
  .cat .sub { font-size: 14px; color: var(--muted); margin-top: 3px; }
  .cat .picked { color: var(--accent); font-weight: 600; }
  .chev { color: var(--faint); flex: none; }

  .media img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .tile { display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; }
  .tile svg { width: 46%; height: auto; max-width: 44px; }
  .tone-0 { background: linear-gradient(140deg, #4a3319, #2b2016); color: #f3c887; }
  .tone-1 { background: linear-gradient(140deg, #4a2a20, #2c1d19); color: #f2a88c; }
  .tone-2 { background: linear-gradient(140deg, #34391f, #22241a); color: #c7d89f; }
  .tone-3 { background: linear-gradient(140deg, #43283a, #291c24); color: #e7b0c4; }

  /* ── Позиции ── */
  .top-bar {
    position: sticky; top: 0; z-index: 5; background: rgba(21, 17, 15, .94);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    padding: calc(10px + env(safe-area-inset-top, 0px)) 0 2px; border-bottom: 1px solid rgba(58, 48, 42, .6);
  }
  .top-row { display: flex; align-items: center; gap: 12px; min-height: 48px; }
  .top-row h2 { margin: 0; font-size: 22px; font-weight: 800; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; letter-spacing: -.01em; }
  .icon-btn { width: 44px; height: 44px; margin-left: -10px; display: flex; align-items: center; justify-content: center; border-radius: 14px; }
  .icon-btn:active { background: var(--surface); }
  .link-danger { color: var(--danger); font-size: 15px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; padding: 10px 0 10px 8px; }

  .items { display: grid; gap: 10px; }
  #catItems, #homeBody .items { margin-top: 14px; }
  .item {
    display: flex; align-items: center; gap: 14px; padding: 10px 12px 10px 10px;
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
    transition: border-color .15s;
  }
  .item.in-cart { border-color: var(--accent-line); }
  .item .media { width: 64px; height: 64px; border-radius: 14px; flex: none; overflow: hidden; }
  .item .tile svg { max-width: 30px; }
  .item .info { flex: 1; min-width: 0; }
  .item .name { font-size: 16px; font-weight: 650; overflow-wrap: break-word; hyphens: auto; -webkit-hyphens: auto; line-height: 1.25; }
  /* В «Ваш заказ» в строке ещё и «×» — миниатюра и счётчик компактнее,
     чтобы название не рвалось посреди слова. */
  #reviewItems .item { gap: 12px; }
  #reviewItems .item .media { width: 52px; height: 52px; border-radius: 12px; }
  #reviewItems .stepper button { width: 34px; }
  #reviewItems .stepper input { width: 40px; }
  .item .unit { font-size: 14px; color: var(--muted); margin-top: 3px; }
  .item .cat-note { font-size: 12px; color: var(--faint); margin-top: 2px; }
  .item .remove { color: var(--faint); width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; flex: none; margin-left: -6px; }

  .add-btn {
    width: 42px; height: 42px; border-radius: 50%; background: var(--accent); color: var(--accent-ink);
    display: flex; align-items: center; justify-content: center; flex: none; transition: transform .1s, background .15s;
  }
  .add-btn:active { transform: scale(.92); background: var(--accent-press); }
  .stepper {
    display: flex; align-items: center; flex: none; height: 42px; border-radius: 14px;
    background: var(--bg); border: 1px solid var(--line); overflow: hidden;
  }
  .stepper button { width: 40px; height: 100%; display: flex; align-items: center; justify-content: center; }
  .stepper button:active { background: var(--surface-2); }
  .stepper .plus { background: var(--accent); color: var(--accent-ink); }
  .stepper .plus:active { background: var(--accent-press); }
  .stepper input {
    width: 46px; height: 100%; text-align: center; background: none; border: none; outline: none;
    font-weight: 700; font-size: 16px; font-variant-numeric: tabular-nums;
  }
  .pop { animation: pop .18s ease; }
  @keyframes pop { 50% { transform: scale(1.1); } }

  .empty-note { text-align: center; color: var(--muted); padding: 40px 12px; font-size: 15px; }

  /* ── Нижняя кнопка «Перейти к заказу» ── */
  .dock {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; pointer-events: none;
    padding: 18px var(--gutter) calc(16px + var(--safe-bottom));
    background: linear-gradient(180deg, rgba(21, 17, 15, 0), rgba(21, 17, 15, .96) 42%);
    transform: translateY(120%); transition: transform .25s ease;
  }
  .dock.show { transform: none; }
  .dock .btn { pointer-events: auto; max-width: 564px; margin: 0 auto; }
  .btn {
    width: 100%; height: 56px; border-radius: 16px; display: flex; align-items: center; justify-content: center; gap: 10px;
    font-size: 17px; font-weight: 700; letter-spacing: .005em;
  }
  .btn-primary { background: var(--accent); color: var(--accent-ink); box-shadow: 0 10px 26px rgba(230, 166, 86, .18); }
  .btn-primary:active { background: var(--accent-press); }
  .btn-primary:disabled { opacity: .55; box-shadow: none; }
  .btn-ghost { background: var(--surface); border: 1px solid var(--line); color: var(--text); font-weight: 650; }
  .btn .count { font-variant-numeric: tabular-nums; }
  .btn .arrow { margin-left: auto; margin-right: 4px; }
  .btn.spread { justify-content: flex-start; padding-left: 18px; }
  .btn.spread .label { flex: 1; text-align: center; margin-left: 24px; }

  /* ── Экран «Ваш заказ» ── */
  .field-label { font-size: 14px; color: var(--muted); margin: 20px 0 8px; display: block; }
  .text-input, textarea {
    width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
    padding: 13px 15px; font-size: 16px; outline: none;
  }
  .text-input:focus, textarea:focus { border-color: var(--accent-line); }
  textarea { resize: vertical; min-height: 88px; }
  ::placeholder { color: var(--faint); }
  .row-date {
    position: relative; display: flex; align-items: center; gap: 12px; margin-top: 14px;
    padding: 14px 16px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line);
  }
  .row-date .v { font-weight: 700; }
  .row-date .change { margin-left: auto; color: var(--accent); font-size: 14px; font-weight: 600; }
  .summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 16px; }
  .summary > div {
    background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 13px 8px;
    text-align: center; min-width: 0;
  }
  .summary .v { font-size: 16px; font-weight: 750; display: flex; align-items: center; justify-content: center; gap: 6px; overflow: hidden; }
  .summary .v span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .summary .k { font-size: 13px; color: var(--muted); margin-top: 3px; }
  .error-box {
    display: none; margin-top: 16px; padding: 13px 15px; border-radius: 14px;
    background: rgba(239, 112, 100, .1); border: 1px solid rgba(239, 112, 100, .4); color: #ffc0b8; font-size: 15px;
  }
  .error-box.show { display: block; }

  /* ── Центрированные экраны: отправка, успех, пусто, ошибка ── */
  .center {
    min-height: calc(100vh - 40px); display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 24px 24px calc(24px + var(--safe-bottom)); max-width: 480px; margin: 0 auto;
  }
  .center h2 { font-size: 26px; font-weight: 800; margin: 26px 0 8px; letter-spacing: -.01em; }
  .center p { color: var(--muted); margin: 0; font-size: 16px; }
  .center .actions { width: 100%; display: flex; flex-direction: column; gap: 10px; margin-top: 30px; }
  .ring { width: 128px; height: 128px; position: relative; display: flex; align-items: center; justify-content: center; }
  .ring svg.track { position: absolute; inset: 0; }
  .ring .spin { animation: spin 1.1s linear infinite; transform-origin: 50% 50%; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .plane { animation: fly 1.4s ease-in-out infinite; color: var(--text); }
  @keyframes fly { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(3px, -3px); } }
  .check-circle { stroke-dasharray: 340; stroke-dashoffset: 340; animation: draw .6s ease forwards; }
  .check-mark { stroke-dasharray: 80; stroke-dashoffset: 80; animation: draw .35s .45s ease forwards; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  .receipt {
    width: 100%; text-align: left; margin-top: 24px; padding: 14px 16px; border-radius: 14px;
    background: var(--surface); border: 1px solid var(--line); font-size: 15px;
  }
  .receipt div { display: flex; justify-content: space-between; gap: 12px; padding: 4px 0; }
  .receipt div span:first-child { color: var(--muted); }
  .receipt div span:last-child { text-align: right; font-weight: 600; }
  .muted-icon { color: var(--muted); }

  .skeleton { background: linear-gradient(90deg, var(--surface) 0%, var(--surface-2) 50%, var(--surface) 100%); background-size: 200% 100%; animation: shimmer 1.2s infinite; border-radius: var(--radius); height: 94px; }
  @keyframes shimmer { to { background-position: -200% 0; } }

  /* ── Планшет и компьютер: шире колонка, крупнее шапка, категории сеткой ── */
  @media (min-width: 700px) {
    :root { --gutter: 32px; }
    body { font-size: 17px; }
    .wrap { max-width: 920px; }
    .hero { height: clamp(360px, 44vh, 520px); }
    .hero-content { padding-bottom: 40px; }
    .logo { width: 96px; height: 96px; border-radius: 24px; }
    .brand { gap: 22px; }
    .brand-text .kicker { font-size: 13px; }
    .brand-text h1 { font-size: clamp(44px, 6vw, 60px); }
    .toolbar { grid-template-columns: minmax(340px, 1fr) 1fr; align-items: stretch; }
    .date-card .val { white-space: nowrap; }
    .toolbar .search { height: auto; min-height: 56px; }
    .cat-list { grid-template-columns: repeat(2, 1fr); gap: 16px; }
    .cat { flex-direction: column; align-items: stretch; gap: 0; padding: 0; overflow: hidden; }
    .cat .media { width: 100%; height: auto; aspect-ratio: 16 / 9; border-radius: 0; }
    .cat .tile svg { max-width: 64px; width: 22%; }
    .cat .meta { padding: 14px 18px 16px; }
    .cat .name { font-size: 20px; }
    .cat .chev { display: none; }
    .items { grid-template-columns: repeat(2, 1fr); gap: 12px; }
    #reviewItems { grid-template-columns: 1fr; }
    .item .media { width: 72px; height: 72px; }
    .btn { height: 60px; font-size: 18px; }
    .dock .btn { max-width: 520px; }
    #scr-review .wrap { max-width: 680px; }
  }
  @media (min-width: 1100px) {
    .cat-list { grid-template-columns: repeat(3, 1fr); }
    .items { grid-template-columns: repeat(3, 1fr); }
  }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } .check-circle, .check-mark { stroke-dashoffset: 0; } }
</style>
</head>
<body>

<!-- 1. Каталог: высокая шапка с фото заведения, логотип и название, дата, поиск, категории -->
<section class="screen active" id="scr-home">
  <header class="hero">
    <div class="hero-bg placeholder" id="heroBg"></div>
    <div class="hero-content">
      <div class="wrap">
        <div class="brand">
          <div class="logo" id="logoBox"></div>
          <div class="brand-text">
            <div class="kicker">Заказ продуктов</div>
            <h1 id="venueLabel">&nbsp;</h1>
          </div>
        </div>
      </div>
    </div>
  </header>
  <div class="wrap">
    <div class="toolbar">
      <label class="date-card">
        <span class="ic">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4.5" width="18" height="17" rx="3"/><path d="M8 2.5v4M16 2.5v4M3 10h18"/></svg>
        </span>
        <span>
          <span class="lbl">Дата заказа</span><br>
          <span class="val" id="dateText">—</span>
        </span>
        <span class="change">Изменить</span>
        <input type="date" id="orderDate" aria-label="Дата заказа">
      </label>
      <div class="search" id="homeSearch">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" class="muted-icon" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input type="search" id="homeQuery" placeholder="Поиск по всем позициям" autocomplete="off" enterkeyhint="search">
        <button class="clear" type="button" aria-label="Очистить поиск" onclick="clearSearch('home')">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </div>
    </div>
    <div id="homeBody">
      <div class="section-head"><h3>Категории</h3></div>
      <div class="cat-list"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div>
    </div>
  </div>
</section>

<!-- 2–3. Позиции категории -->
<section class="screen" id="scr-cat">
  <div class="top-bar">
    <div class="wrap">
      <div class="top-row">
        <button class="icon-btn" type="button" aria-label="Назад" onclick="history.back()">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
        </button>
        <h2 id="catTitle"></h2>
      </div>
      <div class="search" id="catSearch">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" class="muted-icon" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input type="search" id="catQuery" placeholder="Поиск по позициям" autocomplete="off" enterkeyhint="search">
        <button class="clear" type="button" aria-label="Очистить поиск" onclick="clearSearch('cat')">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </div>
    </div>
  </div>
  <div class="wrap"><div class="items" id="catItems"></div></div>
</section>

<!-- 4. Предпросмотр заказа -->
<section class="screen" id="scr-review">
  <div class="top-bar">
    <div class="wrap">
      <div class="top-row">
        <button class="icon-btn" type="button" aria-label="Назад" onclick="history.back()">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
        </button>
        <h2>Ваш заказ</h2>
        <button class="link-danger" type="button" onclick="clearCart()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>
          Очистить
        </button>
      </div>
    </div>
  </div>
  <div class="wrap">
    <div class="items" id="reviewItems" style="margin-top:10px"></div>

    <label class="row-date">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="muted-icon" aria-hidden="true"><rect x="3" y="4.5" width="18" height="17" rx="3"/><path d="M8 2.5v4M16 2.5v4M3 10h18"/></svg>
      <span>Дата: <span class="v" id="reviewDate">—</span></span>
      <span class="change">Изменить</span>
      <input type="date" id="reviewDateInput" aria-label="Изменить дату заказа">
    </label>

    <label class="field-label" for="comment">Комментарий к заказу (необязательно)</label>
    <textarea id="comment" maxlength="1000" placeholder="Например: только свежая продукция"></textarea>

    <label class="field-label" for="submitterName">Ваше имя (необязательно)</label>
    <input class="text-input" id="submitterName" maxlength="80" placeholder="Кто оформил заказ" autocomplete="name">

    <div class="error-box" id="errorBox"></div>

    <button class="btn btn-primary" type="button" id="sendBtn" style="margin-top:18px" onclick="submitOrder()">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M21.4 2.6 2.9 9.9c-.9.4-.9 1.6 0 1.9l5.4 1.9 1.9 5.9c.3.9 1.4 1.1 2 .4l2.8-2.9 4.9 3.6c.7.5 1.7.1 1.9-.8l3-15.4c.2-1.1-.9-1.9-1.9-1.5zM9.9 13.2l8.2-6.6-6.6 7.6-.3 3.3z"/></svg>
      Отправить заказ
    </button>

    <div class="summary" id="summary"></div>
  </div>
</section>

<!-- Пустая корзина -->
<section class="screen" id="scr-empty">
  <div class="center">
    <svg width="96" height="96" viewBox="0 0 96 96" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" class="muted-icon" aria-hidden="true">
      <path d="M14 38h68l-7 40a6 6 0 0 1-6 5H27a6 6 0 0 1-6-5z"/><path d="M30 38 42 16M66 38 54 16"/><path d="M38 52v16M58 52v16M48 52v16"/>
    </svg>
    <h2>Заказ пуст</h2>
    <p>Выберите позиции для оформления заказа</p>
    <div class="actions">
      <button class="btn btn-primary" type="button" onclick="goHome()">Перейти к каталогу</button>
    </div>
  </div>
</section>

<!-- 5. Отправка -->
<section class="screen" id="scr-sending">
  <div class="center">
    <div class="ring">
      <svg class="track" viewBox="0 0 124 124" aria-hidden="true">
        <circle cx="62" cy="62" r="56" fill="none" stroke="#2e2622" stroke-width="6"/>
        <g class="spin"><circle cx="62" cy="62" r="56" fill="none" stroke="#e6a656" stroke-width="6" stroke-linecap="round" stroke-dasharray="120 232"/></g>
      </svg>
      <svg class="plane" width="54" height="54" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" aria-hidden="true"><path d="M21.5 2.5 10.5 13.5M21.5 2.5 14.5 21.5l-4-8-8-4z"/></svg>
    </div>
    <h2>Отправляем заказ…</h2>
    <p>Пожалуйста, подождите</p>
  </div>
</section>

<!-- 6. Успех -->
<section class="screen" id="scr-done">
  <div class="center">
    <svg width="112" height="112" viewBox="0 0 112 112" fill="none" aria-hidden="true">
      <circle class="check-circle" cx="56" cy="56" r="52" stroke="#9fc690" stroke-width="6"/>
      <path class="check-mark" d="M34 57l15 15 29-31" stroke="#9fc690" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <h2>Заказ отправлен!</h2>
    <p id="doneText">Кухня получила ваш заказ. Подтверждение придёт в вашу тему в Telegram.</p>
    <div class="receipt" id="doneReceipt"></div>
    <div class="actions">
      <button class="btn btn-primary" type="button" onclick="startNewOrder(false)">Вернуться к каталогу</button>
      <button class="btn btn-ghost" type="button" onclick="startNewOrder(true)">Повторить этот заказ</button>
    </div>
  </div>
</section>

<!-- Ссылка устарела / недействительна / приём закрыт / нет связи -->
<section class="screen" id="scr-blocked">
  <div class="center">
    <svg width="84" height="84" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" class="muted-icon" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 7v6M12 16.5v.5"/></svg>
    <h2 id="blockedTitle">Форма недоступна</h2>
    <p id="blockedText"></p>
    <div class="actions" id="blockedActions"></div>
  </div>
</section>

<div class="dock" id="dock">
  <button class="btn btn-primary spread" type="button" onclick="openReview()">
    <span class="label">Перейти к заказу (<span class="count" id="dockCount">0</span>)</span>
    <svg class="arrow" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
  </button>
</div>

<script>
  const params = new URLSearchParams(window.location.search);
  // ?f=<секретный токен> — основной адрес формы (с 2026-09-30); ?venue=<slug>
  // — старый, работает только пока сервер его не выключил для этой формы.
  const formToken = params.get("f");
  const venue = params.get("venue");
  const formQuery = formToken ? `f=${encodeURIComponent(formToken)}` : `venue=${encodeURIComponent(venue || "")}`;
  const DRAFT_KEY = `oko_order_draft:${formToken || venue || ""}`;
  const NAME_KEY = "oko_order_name";
  const MAX_QTY = 999;

  const CHEF_HAT = '<svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="#e6a656" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 13.5V20h12v-6.5"/><path d="M6 13.5A4 4 0 0 1 7.2 5.8 5 5 0 0 1 16.8 5.8 4 4 0 0 1 18 13.5z"/><path d="M6 17h12"/></svg>';
  const PLUS = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>';
  const MINUS = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M5 12h14"/></svg>';
  const CROSS = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>';
  const CHEVRON = '<svg class="chev" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>';
  const OTHER = "Другое";

  let form = { label: "", items: [] };
  let cart = {};              // имя позиции → количество
  let currentCategory = null;
  let lastOrder = null;
  let clientOrderId = newClientOrderId();

  // Один id на один заказ: если «Отправить» нажмут дважды или запрос
  // повторится на плохом интернете, сервер не создаст второй заказ.
  function newClientOrderId() {
    const bytes = new Uint8Array(12);
    (window.crypto || window.msCrypto).getRandomValues(bytes);
    return Array.from(bytes, (b) => b.toString(16).padStart(2, "0")).join("");
  }

  function esc(value) {
    return String(value == null ? "" : value)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }
  function plural(n, one, few, many) {
    const m10 = n % 10, m100 = n % 100;
    if (m10 === 1 && m100 !== 11) return one;
    if (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) return few;
    return many;
  }
  function fmtQty(q) { return String(Math.round(q * 100) / 100).replace(".", ","); }
  function fmtDate(iso) {
    if (!iso) return "—";
    const [y, m, d] = iso.split("-");
    return `${d}.${m}.${y}`;
  }
  // «четверг, 2 октября» — для карточки даты под шапкой.
  function humanDate(iso) {
    if (!iso) return "—";
    const [y, m, d] = iso.split("-").map(Number);
    const date = new Date(y, m - 1, d);
    const opts = { weekday: "long", day: "numeric", month: "long" };
    if (y !== new Date().getFullYear()) opts.year = "numeric";
    return date.toLocaleDateString("ru-RU", opts);
  }
  function localIso(date) {
    const tz = date.getTimezoneOffset() * 60000;
    return new Date(date.getTime() - tz).toISOString().slice(0, 10);
  }

  // ── черновик: корзина/комментарий/дата переживают перезагрузку страницы ──
  function storage(fn) { try { return fn(window.localStorage); } catch { return null; } }
  function saveDraft() {
    storage((ls) => ls.setItem(DRAFT_KEY, JSON.stringify({
      cart, comment: document.getElementById("comment").value, date: dateInput.value, savedAt: Date.now(),
    })));
  }
  function loadDraft() {
    const raw = storage((ls) => ls.getItem(DRAFT_KEY));
    if (!raw) return;
    try {
      const d = JSON.parse(raw);
      if (!d || Date.now() - (d.savedAt || 0) > 3 * 86400000) return;
      const known = new Set(form.items.map((i) => i.name));
      Object.entries(d.cart || {}).forEach(([name, qty]) => {
        if (known.has(name) && qty > 0) cart[name] = Math.min(MAX_QTY, qty);
      });
      document.getElementById("comment").value = d.comment || "";
      if (d.date && d.date >= localIso(new Date())) setDate(d.date);
    } catch {}
  }

  // ── дата ──
  const dateInput = document.getElementById("orderDate");
  const reviewDateInput = document.getElementById("reviewDateInput");
  function setDate(iso) {
    dateInput.value = iso;
    reviewDateInput.value = iso;
    document.getElementById("dateText").textContent = humanDate(iso);
    document.getElementById("reviewDate").textContent = fmtDate(iso);
  }
  [dateInput, reviewDateInput].forEach((el) => el.addEventListener("change", () => {
    if (el.value) { setDate(el.value); saveDraft(); }
  }));
  setDate(localIso(new Date(Date.now() + 86400000)));
  dateInput.min = reviewDateInput.min = localIso(new Date());

  // ── навигация: экраны + кнопка «назад» телефона ──
  function show(id) {
    document.querySelectorAll(".screen").forEach((s) => s.classList.toggle("active", s.id === id));
    window.scrollTo(0, 0);
    updateDock();
  }
  function screenFromState(state) {
    const s = state || {};
    if (s.screen === "cat" && s.category != null && categoryNames().includes(s.category)) {
      currentCategory = s.category;
      document.getElementById("catQuery").value = "";
      document.getElementById("catSearch").classList.remove("has-text");
      renderCategory();
      show("scr-cat");
    } else if (s.screen === "review") {
      renderReview();
    } else {
      renderHome();
      show("scr-home");
    }
  }
  window.addEventListener("popstate", (e) => {
    const active = document.querySelector(".screen.active");
    if (active && ["scr-sending", "scr-blocked"].includes(active.id)) return;
    if (active && active.id === "scr-done") { history.pushState({ screen: "done" }, ""); return; }
    screenFromState(e.state);
  });
  function openCategory(name) {
    history.pushState({ screen: "cat", category: name }, "");
    screenFromState({ screen: "cat", category: name });
  }
  function openReview() {
    history.pushState({ screen: "review" }, "");
    renderReview();
  }
  function goHome() {
    history.replaceState({ screen: "home" }, "");
    screenFromState({ screen: "home" });
  }

  // ── каталог ──
  function categoryOf(item) { return item.category || OTHER; }
  function categoryNames() {
    const names = [];
    form.items.forEach((i) => { const c = categoryOf(i); if (!names.includes(c)) names.push(c); });
    return names;
  }
  function hasCategories() { return form.items.some((i) => i.category); }

  // Значки категорий — вместо буквы-заглушки, когда фото ещё не загружено.
  // Подбираются по смыслу названия категории; оттенок плашки — один из
  // четырёх тёплых, стабильный для категории (по хэшу названия).
  const ICON_PATHS = {
    cake: '<path d="M4 20.5h16"/><path d="M5.5 20.5v-6.5a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v6.5"/><path d="M5.5 16.2c1.4 1 2.8 1 4.2 0s2.8-1 4.2 0 2.8 1 4.2 0"/><path d="M12 12V8.5"/><path d="M12 6.3c.9 0 1.4-.7 1.4-1.4 0-.9-1.4-2.4-1.4-2.4s-1.4 1.5-1.4 2.4c0 .7.5 1.4 1.4 1.4z"/>',
    bread: '<path d="M6.5 20h11a2 2 0 0 0 2-2v-7.2A3.6 3.6 0 0 0 20.8 8c0-2.5-3.9-4.5-8.8-4.5S3.2 5.5 3.2 8a3.6 3.6 0 0 0 1.3 2.8V18a2 2 0 0 0 2 2z"/><path d="M9 10.5l1.6 1.6M12.4 9.4 14 11M15.6 10.5l1.2 1.2"/>',
    meat: '<path d="M16 4.6c3 1.3 4.7 4.5 3.7 7.8-1.1 3.8-5 6.4-9.2 6.1-3.5-.3-6.1-2.3-6.1-5.2 0-2.4 1.8-3.4 3.3-4.7 1.7-1.5 2.4-4 4.6-4.5 1.3-.3 2.5-.1 3.7.5z"/><circle cx="14.3" cy="10.3" r="2.1"/>',
    poultry: '<path d="M14.8 3.8a5 5 0 0 1 2.8 8.4 5 5 0 0 1-4.6 1.4l-3.2 3.2a2 2 0 1 1-2.4 2.4 2 2 0 1 1-2.4-2.4 2 2 0 0 1 2.4-.1l3.2-3.2a5 5 0 0 1 4.2-9.7z"/>',
    fish: '<path d="M5.5 12c2.2-3.6 5.4-5.6 8.6-5.6 3 0 5.6 2 7.4 5.6-1.8 3.6-4.4 5.6-7.4 5.6-3.2 0-6.4-2-8.6-5.6z"/><path d="M5.5 12 2.5 8v8z"/><circle cx="16.8" cy="10.8" r=".9" fill="currentColor" stroke="none"/>',
    veg: '<path d="M15.6 8.4c-1.4-1.4-3.6-1.4-5 0L3.7 17.9c-.8 1 .2 2.4 1.3 2l9.4-4c1.4-.6 2.3-1.8 2.6-3.2.3-1.6-.2-3.2-1.4-4.3z"/><path d="M15.6 8.4 20.5 3.5M16.6 4.2c1.3-.9 3-.6 3.8.7M19.8 7.4c.9-1.3.6-3-.7-3.8"/><path d="M8.3 13.4l1.5 1.5M11 11l1.4 1.4"/>',
    fruit: '<path d="M12 7.4c-2.2-1.6-6.4-1-7.1 3.1-.7 3.7 1.6 9.3 4.5 9.3 1 0 1.6-.6 2.6-.6s1.6.6 2.6.6c2.9 0 5.2-5.6 4.5-9.3-.7-4.1-4.9-4.7-7.1-3.1z"/><path d="M12 7.4c0-2 .6-3.6 2.2-4.6"/><path d="M12.6 5.2c1.4-.2 2.6.3 3.3 1.4"/>',
    dairy: '<path d="M8.5 2.5h7"/><path d="M9.3 2.5v3L6.5 9.4V19.5a2 2 0 0 0 2 2h7a2 2 0 0 0 2-2V9.4l-2.8-3.9v-3"/><path d="M6.5 13.5h11"/>',
    drink: '<path d="M5 8.5h12v5.5a5 5 0 0 1-5 5h-2a5 5 0 0 1-5-5z"/><path d="M17 10h1.4a2.6 2.6 0 0 1 0 5.2H17"/><path d="M9 3c-.7.8-.7 1.8 0 2.6M13 3c-.7.8-.7 1.8 0 2.6"/>',
    pot: '<path d="M3 10.5h18"/><path d="M5 10.5v6.5a3 3 0 0 0 3 3h8a3 3 0 0 0 3-3v-6.5"/><path d="M9 7c0-1.5 1.3-2.6 3-2.6S15 5.5 15 7"/><path d="M1.8 12.5H5M19 12.5h3.2"/>',
    egg: '<path d="M12 3c-3.6 0-6.5 5.4-6.5 9.7a6.5 6.5 0 0 0 13 0C18.5 8.4 15.6 3 12 3z"/><path d="M9 13.5a3 3 0 0 0 2.2 3"/>',
    frozen: '<path d="M12 2.5v19M4 7l16 10M4 17 20 7"/><path d="m9.5 4 2.5 2.5L14.5 4M9.5 20l2.5-2.5 2.5 2.5"/>',
    basket: '<path d="M3 9.5h18l-1.8 9.2a2 2 0 0 1-2 1.8H6.8a2 2 0 0 1-2-1.8z"/><path d="M8 9.5l3-5.5M16 9.5l-3-5.5"/><path d="M9 13.5v3.5M12 13.5v3.5M15 13.5v3.5"/>',
  };
  const ICON_RULES = [
    [/десерт|торт|пирож|сладк|кондит|выпеч|кекс|печень/, "cake"],
    [/мучн|хлеб|булоч|булк|тесто|лаваш|лепёш|лепеш|пицц/, "bread"],
    [/птиц|курин|куриц|цыпл|индей|утк/, "poultry"],
    [/мяс|говя|свин|баран|телят|фарш|стейк|колбас|сосис/, "meat"],
    [/рыб|море|кревет|лосос|кальм|икр/, "fish"],
    [/овощ|зелен|салат|картоф|морков|лук|томат|огур/, "veg"],
    [/фрукт|ягод|яблок|цитрус/, "fruit"],
    [/молоч|сыр|слив|творог|масло|молок|йогур/, "dairy"],
    [/напит|сок|лимонад|чай|кофе|вода|морс/, "drink"],
    [/соус|заготов|полуфаб|суп|бульон|гарнир/, "pot"],
    [/яйц/, "egg"],
    [/замор|морож|лёд|лед/, "frozen"],
  ];
  function iconFor(category) {
    const name = String(category || "").toLowerCase();
    const rule = ICON_RULES.find(([re]) => re.test(name));
    const key = rule ? rule[1] : "basket";
    return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON_PATHS[key]}</svg>`;
  }
  function toneFor(category) {
    let h = 0;
    for (const ch of String(category || "")) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
    return `tone-${h % 4}`;
  }
  function mediaHtml(photoUrl, category) {
    if (photoUrl) return `<div class="media"><img src="${esc(photoUrl)}" alt="" loading="lazy"></div>`;
    return `<div class="media"><div class="tile ${toneFor(category)}">${iconFor(category)}</div></div>`;
  }
  function thumbHtml(item) {
    return mediaHtml(item && item.photoUrl, item ? categoryOf(item) : "");
  }
  function categoryPhoto(name, items) {
    if (form.categoryPhotos && form.categoryPhotos[name]) return form.categoryPhotos[name];
    const withPhoto = items.find((i) => i.photoUrl);
    return withPhoto ? withPhoto.photoUrl : null;
  }

  function itemRowHtml(item, opts = {}) {
    const qty = cart[item.name] || 0;
    const key = esc(item.name);
    const control = qty > 0
      ? `<div class="stepper">
           <button type="button" aria-label="Меньше" data-act="dec" data-name="${key}">${MINUS}</button>
           <input type="text" inputmode="decimal" value="${fmtQty(qty)}" data-act="set" data-name="${key}" aria-label="Количество">
           <button type="button" class="plus" aria-label="Больше" data-act="inc" data-name="${key}">${PLUS}</button>
         </div>`
      : `<button type="button" class="add-btn" aria-label="Добавить" data-act="inc" data-name="${key}">${PLUS}</button>`;
    return `
      <div class="item ${qty > 0 ? "in-cart" : ""}" data-row="${key}">
        ${thumbHtml(item)}
        <div class="info">
          <div class="name">${esc(item.name)}</div>
          <div class="unit">1 ${esc(item.unit)}</div>
          ${opts.showCategory && item.category ? `<div class="cat-note">${esc(item.category)}</div>` : ""}
        </div>
        ${control}
        ${opts.removable ? `<button type="button" class="remove" aria-label="Убрать" data-act="remove" data-name="${key}">${CROSS}</button>` : ""}
      </div>`;
  }

  function matches(item, q) {
    if (!q) return true;
    const hay = `${item.name} ${item.category || ""}`.toLowerCase().replace(/ё/g, "е");
    return q.toLowerCase().replace(/ё/g, "е").trim().split(/\s+/).every((w) => hay.includes(w));
  }

  function renderHome() {
    const body = document.getElementById("homeBody");
    const q = document.getElementById("homeQuery").value.trim();
    if (!form.items.length) {
      body.innerHTML = '<div class="empty-note">Список позиций пока пуст — обратитесь к кухне.</div>';
      return;
    }
    if (q || !hasCategories()) {
      const found = form.items.filter((i) => matches(i, q));
      const head = q
        ? `<div class="section-head"><h3>Поиск</h3><span>${found.length ? `${found.length} ${plural(found.length, "позиция", "позиции", "позиций")}` : ""}</span></div>`
        : `<div class="section-head"><h3>Позиции</h3></div>`;
      body.innerHTML = head + (found.length
        ? `<div class="items">${found.map((i) => itemRowHtml(i, { showCategory: !!q })).join("")}</div>`
        : `<div class="empty-note">Ничего не нашлось по запросу «${esc(q)}»</div>`);
      return;
    }
    const names = categoryNames();
    body.innerHTML = `<div class="section-head"><h3>Категории</h3></div><div class="cat-list">${names.map((name) => {
      const items = form.items.filter((i) => categoryOf(i) === name);
      const picked = items.filter((i) => cart[i.name] > 0).length;
      return `
        <button type="button" class="cat ${picked ? "has-picked" : ""}" data-cat="${esc(name)}">
          ${mediaHtml(categoryPhoto(name, items), name)}
          <div class="meta">
            <div class="name">${esc(name)}</div>
            <div class="sub">${items.length} ${plural(items.length, "позиция", "позиции", "позиций")}${picked ? ` · <span class="picked">${picked} в заказе</span>` : ""}</div>
          </div>
          ${CHEVRON}
        </button>`;
    }).join("")}</div>`;
  }

  function renderCategory() {
    document.getElementById("catTitle").textContent = currentCategory;
    const q = document.getElementById("catQuery").value.trim();
    const items = form.items.filter((i) => categoryOf(i) === currentCategory && matches(i, q));
    document.getElementById("catItems").innerHTML = items.length
      ? items.map((i) => itemRowHtml(i)).join("")
      : `<div class="empty-note">Ничего не нашлось по запросу «${esc(q)}»</div>`;
  }

  function cartItems() { return form.items.filter((i) => cart[i.name] > 0); }

  function renderReview() {
    const items = cartItems();
    if (!items.length) { show("scr-empty"); return; }
    document.getElementById("reviewItems").innerHTML = items.map((i) => itemRowHtml(i, { removable: true })).join("");
    renderSummary();
    show("scr-review");
  }

  function renderSummary() {
    const items = cartItems();
    const byUnit = {};
    items.forEach((i) => { byUnit[i.unit] = (byUnit[i.unit] || 0) + cart[i.name]; });
    const totals = Object.entries(byUnit).map(([u, q]) => `${fmtQty(q)} ${u}`).join(" · ");
    const cats = [...new Set(items.map(categoryOf))];
    const catText = cats.length === 1 ? cats[0] : `${cats.length} ${plural(cats.length, "категория", "категории", "категорий")}`;
    document.getElementById("summary").innerHTML = `
      <div><div class="v"><span>${esc(totals)}</span></div><div class="k">Всего</div></div>
      <div><div class="v"><span>${items.length}</span></div><div class="k">${plural(items.length, "Позиция", "Позиции", "Позиций")}</div></div>
      <div><div class="v"><span>${esc(catText)}</span></div><div class="k">${cats.length === 1 ? "Категория" : "Категории"}</div></div>`;
  }

  function updateDock() {
    const n = Object.values(cart).filter((q) => q > 0).length;
    document.getElementById("dockCount").textContent = n;
    const active = document.querySelector(".screen.active");
    const onCatalog = active && (active.id === "scr-home" || active.id === "scr-cat");
    document.getElementById("dock").classList.toggle("show", !!(onCatalog && n > 0));
  }

  // Точечная перерисовка одной строки — чтобы поле количества не теряло фокус
  // и список не прыгал при каждом нажатии +/−.
  function refreshRows(name, animate) {
    const item = form.items.find((i) => i.name === name);
    document.querySelectorAll(".item[data-row]").forEach((row) => {
      if (row.dataset.row !== name) return;
      const inReview = !!row.closest("#reviewItems");
      const showCategory = !!row.querySelector(".cat-note");
      if (inReview && !(cart[name] > 0)) { row.remove(); return; }
      const tmp = document.createElement("div");
      tmp.innerHTML = itemRowHtml(item, { removable: inReview, showCategory });
      const fresh = tmp.firstElementChild;
      row.replaceWith(fresh);
      if (animate) { const s = fresh.querySelector(".stepper input"); if (s) s.classList.add("pop"); }
    });
    const active = document.querySelector(".screen.active");
    if (active && active.id === "scr-review") {
      if (!cartItems().length) show("scr-empty"); else renderSummary();
    }
    updateDock();
    saveDraft();
  }

  function setQty(name, qty) {
    const q = Math.max(0, Math.min(MAX_QTY, Math.round(qty * 100) / 100));
    if (q > 0) cart[name] = q; else delete cart[name];
  }

  document.addEventListener("click", (e) => {
    const cat = e.target.closest("[data-cat]");
    if (cat) { openCategory(cat.dataset.cat); return; }
    const btn = e.target.closest("button[data-act]");
    if (!btn) return;
    const name = btn.dataset.name;
    const qty = cart[name] || 0;
    if (btn.dataset.act === "inc") setQty(name, Math.floor(qty) + 1);
    else if (btn.dataset.act === "dec") setQty(name, qty > 1 ? Math.ceil(qty) - 1 : 0);
    else if (btn.dataset.act === "remove") setQty(name, 0);
    refreshRows(name, btn.dataset.act !== "remove");
  });
  document.addEventListener("change", (e) => {
    const input = e.target.closest("input[data-act=set]");
    if (!input) return;
    const n = parseFloat(String(input.value).replace(",", "."));
    setQty(input.dataset.name, Number.isFinite(n) ? n : 0);
    refreshRows(input.dataset.name, false);
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && e.target.matches("input[data-act=set]")) e.target.blur();
  });

  function bindSearch(which, render) {
    const input = document.getElementById(`${which}Query`);
    const box = document.getElementById(`${which}Search`);
    input.addEventListener("input", () => { box.classList.toggle("has-text", !!input.value); render(); });
  }
  bindSearch("home", renderHome);
  bindSearch("cat", renderCategory);
  function clearSearch(which) {
    const input = document.getElementById(`${which}Query`);
    input.value = "";
    document.getElementById(`${which}Search`).classList.remove("has-text");
    which === "home" ? renderHome() : renderCategory();
    input.focus();
  }

  function clearCart() {
    if (!confirm("Убрать все позиции из заказа?")) return;
    cart = {};
    saveDraft();
    show("scr-empty");
  }

  // ── отправка ──
  function showError(text) {
    const box = document.getElementById("errorBox");
    box.textContent = text;
    box.classList.add("show");
    box.scrollIntoView({ behavior: "smooth", block: "center" });
  }

  async function submitOrder() {
    document.getElementById("errorBox").classList.remove("show");
    const items = cartItems().map((i) => ({ name: i.name, qty: cart[i.name] }));
    if (!items.length) { show("scr-empty"); return; }
    if (!dateInput.value) { showError("Укажите дату заказа"); return; }
    const name = document.getElementById("submitterName").value.trim();
    storage((ls) => ls.setItem(NAME_KEY, name));
    const payload = {
      ...(formToken ? { f: formToken } : { venue }),
      clientOrderId,
      name,
      date: dateInput.value,
      items,
      comment: document.getElementById("comment").value.trim(),
    };
    const sendBtn = document.getElementById("sendBtn");
    sendBtn.disabled = true;
    show("scr-sending");
    const started = Date.now();
    let res, data;
    try {
      res = await fetch("/api/oko-order/submit", {
        method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload),
      });
      data = await res.json().catch(() => ({}));
    } catch {
      res = null;
    }
    // Анимация отправки видна хотя бы мгновение — иначе экран «мигает».
    const wait = 900 - (Date.now() - started);
    if (wait > 0) await new Promise((r) => setTimeout(r, wait));
    sendBtn.disabled = false;
    if (!res) {
      renderReview();
      showError("Нет соединения. Заказ не отправлен — попробуйте ещё раз.");
      return;
    }
    if (!res.ok) {
      if (data.expired || data.closed || res.status === 404) { showBlocked(data); return; }
      renderReview();
      showError(data.error || "Не удалось отправить заказ, попробуйте ещё раз");
      return;
    }
    lastOrder = { cart: { ...cart }, comment: payload.comment, date: payload.date };
    renderDone(payload);
    cart = {};
    document.getElementById("comment").value = "";
    clientOrderId = newClientOrderId();
    storage((ls) => ls.removeItem(DRAFT_KEY));
    history.replaceState({ screen: "done" }, "");
    show("scr-done");
  }

  function renderDone(payload) {
    const units = {};
    payload.items.forEach((line) => {
      const item = form.items.find((i) => i.name === line.name);
      const u = item ? item.unit : "шт.";
      units[u] = (units[u] || 0) + line.qty;
    });
    document.getElementById("doneReceipt").innerHTML = `
      <div><span>Заказчик</span><span>${esc(form.label)}</span></div>
      <div><span>Дата</span><span>${fmtDate(payload.date)}</span></div>
      <div><span>Позиций</span><span>${payload.items.length}</span></div>
      <div><span>Всего</span><span>${esc(Object.entries(units).map(([u, q]) => `${fmtQty(q)} ${u}`).join(" · "))}</span></div>`;
  }

  function startNewOrder(repeat) {
    if (repeat && lastOrder) {
      cart = { ...lastOrder.cart };
      document.getElementById("comment").value = lastOrder.comment || "";
    }
    saveDraft();
    history.replaceState({ screen: "home" }, "");
    if (repeat) { history.pushState({ screen: "review" }, ""); renderReview(); }
    else screenFromState({ screen: "home" });
  }

  function showBlocked(data) {
    const d = data || {};
    document.getElementById("blockedTitle").textContent = d.expired
      ? "Ссылка устарела"
      : d.closed ? "Приём заказов закрыт" : d.offline ? "Нет соединения" : "Ссылка недействительна";
    document.getElementById("blockedText").textContent = d.error || "Нажмите кнопку «Заполнить заказ» в вашей теме Telegram ещё раз.";
    document.getElementById("blockedActions").innerHTML = d.offline
      ? '<button class="btn btn-primary" type="button" onclick="location.reload()">Попробовать снова</button>'
      : "";
    show("scr-blocked");
  }

  function applyBranding(data) {
    document.getElementById("venueLabel").textContent = data.label || "Заказ";
    document.title = data.label ? `Заказ — ${data.label}` : "Заказ продуктов";
    const bg = document.getElementById("heroBg");
    if (data.coverUrl) {
      const img = new Image();
      img.alt = "";
      img.onload = () => { bg.classList.remove("placeholder"); };
      img.src = data.coverUrl;
      bg.appendChild(img);
    }
    document.getElementById("logoBox").innerHTML = data.logoUrl
      ? `<img src="${esc(data.logoUrl)}" alt="">`
      : CHEF_HAT;
  }

  async function load() {
    document.getElementById("logoBox").innerHTML = CHEF_HAT;
    if (!formToken && !venue) { showBlocked({ error: "В ссылке нет адреса формы. Нажмите кнопку «Заполнить заказ» в вашей теме Telegram." }); return; }
    let res, data;
    try {
      res = await fetch(`/api/oko-order/items?${formQuery}`);
      data = await res.json().catch(() => ({}));
    } catch {
      showBlocked({ offline: true, error: "Проверьте интернет и попробуйте снова." });
      return;
    }
    if (!res.ok) { showBlocked(data); return; }
    form = {
      label: data.label,
      items: Array.isArray(data.items) ? data.items : [],
      categoryPhotos: data.categoryPhotos && typeof data.categoryPhotos === "object" ? data.categoryPhotos : {},
    };
    applyBranding(data);
    document.getElementById("submitterName").value = storage((ls) => ls.getItem(NAME_KEY)) || "";
    loadDraft();
    ["comment", "submitterName"].forEach((id) => document.getElementById(id).addEventListener("input", saveDraft));
    history.replaceState({ screen: "home" }, "");
    renderHome();
    show("scr-home");
  }

  load();
</script>
</body>
</html>
