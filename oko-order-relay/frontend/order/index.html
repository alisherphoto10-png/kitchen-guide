<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Заказ OKO</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #f5f5f5; margin: 0; padding: 16px; color: #111; }
  h1 { font-size: 18px; margin: 0 0 16px; }
  label { font-size: 14px; color: #444; }
  .item { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #e0e0e0; }
  .item .name { flex: 1; display: flex; align-items: center; gap: 8px; font-size: 15px; }
  .item input[type="number"] { width: 56px; padding: 6px; border: 1px solid #ccc; border-radius: 6px; }
  input[type="text"], input[type="date"], textarea { width: 100%; padding: 8px; margin-top: 4px; border: 1px solid #ccc; border-radius: 6px; font-family: inherit; }
  textarea { margin-top: 12px; }
  button.submit { width: 100%; padding: 14px; margin-top: 16px; background: #2ea043; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; }
  button.submit:disabled { opacity: 0.6; }
  .empty { color: #888; font-size: 14px; padding: 16px 0; }
  .done { text-align: center; padding: 40px 16px; }
  .done .check { font-size: 40px; }
  .error { color: #c0392b; font-size: 14px; margin-top: 10px; }
</style>
</head>
<body>
  <div id="formScreen">
    <h1 id="venueLabel">Заказ</h1>

    <label>Ваше имя</label>
    <input type="text" id="submitterName" placeholder="Имя">

    <label style="margin-top:12px;display:block">Дата заказа</label>
    <input type="date" id="orderDate">

    <label style="margin-top:12px;display:block">Позиции</label>
    <div id="itemsList" class="empty">Загрузка...</div>

    <textarea id="comment" placeholder="Комментарий (необязательно)" rows="3"></textarea>
    <div class="error" id="errorText"></div>
    <button class="submit" id="submitBtn" onclick="submitOrder()">Отправить заказ</button>
  </div>

  <div id="doneScreen" class="done" style="display:none">
    <div class="check">✅</div>
    <h1>Заказ отправлен</h1>
    <p>Можно закрыть эту страницу.</p>
  </div>

<script>
  const params = new URLSearchParams(window.location.search);
  const venue = params.get("venue");

  const dateInput = document.getElementById("orderDate");
  const tomorrow = new Date(Date.now() + 86400000);
  dateInput.value = tomorrow.toISOString().split("T")[0];

  let currentItems = [];

  async function loadItems() {
    if (!venue) {
      document.getElementById("venueLabel").innerText = "Не указано заведение";
      return;
    }
    try {
      const res = await fetch(`/api/oko-order/items?venue=${encodeURIComponent(venue)}`);
      if (!res.ok) {
        document.getElementById("venueLabel").innerText = "Ошибка загрузки";
        return;
      }
      const data = await res.json();
      document.getElementById("venueLabel").innerText = data.label;
      currentItems = data.items;
      renderItems();
    } catch {
      document.getElementById("venueLabel").innerText = "Нет соединения";
    }
  }

  function renderItems() {
    const list = document.getElementById("itemsList");
    if (!currentItems.length) {
      list.className = "empty";
      list.innerText = "Список позиций пуст — обратитесь к администратору.";
      return;
    }
    list.className = "";
    list.innerHTML = currentItems
      .map(
        (name, i) => `
      <div class="item">
        <span class="name"><input type="checkbox" id="check-${i}"> ${name}</span>
        <input type="number" id="qty-${i}" min="1" value="1" disabled>
      </div>
    `,
      )
      .join("");

    currentItems.forEach((_, i) => {
      document.getElementById(`check-${i}`).addEventListener("change", (e) => {
        document.getElementById(`qty-${i}`).disabled = !e.target.checked;
      });
    });
  }

  function collectItems() {
    const items = [];
    currentItems.forEach((name, i) => {
      const checked = document.getElementById(`check-${i}`).checked;
      if (checked) {
        const qty = parseInt(document.getElementById(`qty-${i}`).value, 10) || 1;
        items.push({ name, qty });
      }
    });
    return items;
  }

  async function submitOrder() {
    const errorEl = document.getElementById("errorText");
    errorEl.innerText = "";

    const items = collectItems();
    if (!items.length) {
      errorEl.innerText = "Добавьте хотя бы одну позицию";
      return;
    }

    const payload = {
      venue: venue,
      name: document.getElementById("submitterName").value.trim(),
      date: dateInput.value,
      items: items,
      comment: document.getElementById("comment").value || "",
    };

    const submitBtn = document.getElementById("submitBtn");
    submitBtn.disabled = true;
    submitBtn.innerText = "Отправляем...";

    try {
      const res = await fetch("/api/oko-order/submit", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        errorEl.innerText = data.error || "Не удалось отправить заказ";
        submitBtn.disabled = false;
        submitBtn.innerText = "Отправить заказ";
        return;
      }
      document.getElementById("formScreen").style.display = "none";
      document.getElementById("doneScreen").style.display = "block";
    } catch {
      errorEl.innerText = "Нет соединения. Попробуйте ещё раз.";
      submitBtn.disabled = false;
      submitBtn.innerText = "Отправить заказ";
    }
  }

  loadItems();
</script>
</body>
</html>
