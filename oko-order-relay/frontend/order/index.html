<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Заказ OKO</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0d1117; margin: 0; padding: 24px 16px 40px; color: #e6edf3; }

  .venue-head { display: flex; align-items: center; gap: 10px; margin: 0 0 22px; }
  .venue-head .bar { width: 4px; height: 26px; background: #238636; border-radius: 2px; flex: none; }
  h1 { font-size: 24px; font-weight: 700; letter-spacing: -0.01em; margin: 0; }

  label { font-size: 12px; color: #8b949e; display: block; margin-bottom: 6px; }
  .field { margin-bottom: 14px; }
  .field.date { margin-bottom: 24px; }

  input[type="text"], input[type="date"], textarea {
    width: 100%; padding: 10px 12px; background: #161b22; border: 1px solid #30363d;
    color: #e6edf3; border-radius: 8px; font-size: 15px; font-family: inherit;
    color-scheme: dark;
  }
  input[type="text"]::placeholder, textarea::placeholder { color: #6e7681; }
  textarea { resize: vertical; min-height: 70px; font-size: 14px; }

  .section-label { font-size: 12px; color: #8b949e; text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 12px; }

  .category-pill {
    display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px;
    background: rgba(63, 185, 80, 0.12); border: 1px solid rgba(63, 185, 80, 0.35);
    border-radius: 100px; margin: 0 0 10px; user-select: none;
  }
  .category-pill .dot { width: 6px; height: 6px; border-radius: 50%; background: #3fb950; }
  .category-pill .label { font-size: 11px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: #3fb950; }
  .category-group { margin-bottom: 14px; }
  .category-group:last-child { margin-bottom: 0; }
  .item-list { display: flex; flex-direction: column; gap: 8px; }

  .item {
    display: flex; align-items: center; gap: 12px; padding: 14px;
    background: #161b22; border: 1.5px solid #30363d; border-radius: 12px;
    user-select: none;
  }
  .item.checked { background: rgba(35, 134, 54, 0.10); border-color: #238636; }

  .item .box {
    width: 22px; height: 22px; border-radius: 7px; flex: none; border: 1.5px solid #30363d;
    display: flex; align-items: center; justify-content: center; position: relative; cursor: pointer;
  }
  .item.checked .box { background: #238636; border-color: #238636; }
  .item .box svg { display: none; }
  .item.checked .box svg { display: block; }
  .item .box input[type="checkbox"] {
    position: absolute; inset: 0; margin: 0; opacity: 0; cursor: pointer;
  }

  .item .name { flex: 1; font-size: 15px; cursor: pointer; }
  .item.checked .name { font-weight: 600; }

  .qty-stepper { display: none; align-items: center; gap: 8px; background: #238636; border-radius: 100px; padding: 5px 6px 5px 8px; flex: none; }
  .item.checked .qty-stepper { display: flex; }
  .qty-btn {
    width: 20px; height: 20px; border: none; background: none; padding: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px; font-weight: 700; color: #fff; cursor: pointer; touch-action: manipulation;
  }
  input.qty-input {
    width: 30px; text-align: center; font-size: 14px; font-weight: 700; color: #fff;
    font-variant-numeric: tabular-nums; background: rgba(255,255,255,0.20); border: none;
    border-radius: 6px; padding: 2px 2px; font-family: inherit;
  }
  input.qty-input:focus { outline: 1px solid rgba(255,255,255,0.6); }

  .hint { font-size: 11px; color: #8b949e; line-height: 1.4; margin: 10px 0 24px; }

  button.submit {
    width: 100%; padding: 16px; margin-top: 4px; background: #238636; color: #fff; border: none;
    border-radius: 12px; font-size: 16px; font-weight: 700; letter-spacing: 0.01em;
    box-shadow: 0 8px 24px rgba(35, 134, 54, 0.35); cursor: pointer;
  }
  button.submit:disabled { opacity: 0.6; box-shadow: none; }

  .empty { color: #8b949e; font-size: 14px; padding: 16px 0; }
  .done { text-align: center; padding: 60px 16px; }
  .done h1 { justify-content: center; }
  .done p { color: #8b949e; font-size: 14px; }
  .error { color: #f85149; font-size: 13px; margin-top: 10px; min-height: 16px; }
</style>
</head>
<body>
  <div id="formScreen">
    <div class="venue-head"><div class="bar"></div><h1 id="venueLabel">Заказ</h1></div>

    <div class="field">
      <label>Ваше имя</label>
      <input type="text" id="submitterName" placeholder="Имя">
    </div>

    <div class="field date">
      <label>Дата заказа</label>
      <input type="date" id="orderDate">
    </div>

    <div class="section-label">Позиции</div>
    <div id="itemsList" class="empty">Загрузка...</div>
    <div class="hint">Число рядом с − / + можно листать кнопками или вписать вручную.</div>

    <div class="field">
      <textarea id="comment" placeholder="Комментарий (необязательно)" rows="3"></textarea>
    </div>
    <div class="error" id="errorText"></div>
    <button class="submit" id="submitBtn" onclick="submitOrder()">Отправить заказ</button>
  </div>

  <div id="doneScreen" class="done" style="display:none">
    <div class="venue-head" style="justify-content:center"><h1>Заказ отправлен</h1></div>
    <p>Можно закрыть эту страницу.</p>
  </div>

<script>
  const params = new URLSearchParams(window.location.search);
  const venue = params.get("venue");

  const dateInput = document.getElementById("orderDate");
  const tomorrow = new Date(Date.now() + 86400000);
  dateInput.value = tomorrow.toISOString().split("T")[0];

  let currentItems = [];
  let quantities = [];

  async function loadItems() {
    if (!venue) {
      document.getElementById("venueLabel").innerText = "Не указано заведение";
      return;
    }
    try {
      const res = await fetch(`/api/oko-order/items?venue=${encodeURIComponent(venue)}`);
      if (!res.ok) {
        document.getElementById("venueLabel").innerText = "Ошибка загрузки";
        return;
      }
      const data = await res.json();
      document.getElementById("venueLabel").innerText = data.label;
      currentItems = data.items;
      quantities = currentItems.map(() => 1);
      renderItems();
    } catch {
      document.getElementById("venueLabel").innerText = "Нет соединения";
    }
  }

  const checkIcon = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>';

  function renderItems() {
    const list = document.getElementById("itemsList");
    if (!currentItems.length) {
      list.className = "empty";
      list.innerText = "Список позиций пуст — обратитесь к администратору.";
      return;
    }
    list.className = "";

    // Group by category, preserving each item's original index (needed for
    // the check-i / qty-i element ids and the quantities[] array).
    const categoryOrder = [];
    const byCategory = {};
    currentItems.forEach((item, i) => {
      const key = item.category || "";
      if (!byCategory[key]) {
        byCategory[key] = [];
        categoryOrder.push(key);
      }
      byCategory[key].push(i);
    });
    const showHeadings = categoryOrder.length > 1 || (categoryOrder.length === 1 && categoryOrder[0] !== "");

    list.innerHTML = categoryOrder
      .map((key) => `
        <div class="category-group">
          ${showHeadings ? `
            <div class="category-pill"><span class="dot"></span><span class="label">${key || "Без категории"}</span></div>
          ` : ""}
          <div class="item-list">
            ${byCategory[key]
              .map(
                (i) => `
              <div class="item" id="item-${i}">
                <div class="box">
                  <input type="checkbox" id="check-${i}">
                  ${checkIcon}
                </div>
                <label class="name" for="check-${i}">${currentItems[i].name}</label>
                <div class="qty-stepper">
                  <button type="button" class="qty-btn" onclick="changeQty(${i}, -1)">−</button>
                  <input type="text" inputmode="numeric" class="qty-input" id="qty-${i}" value="1">
                  <button type="button" class="qty-btn" onclick="changeQty(${i}, 1)">+</button>
                </div>
              </div>
            `,
              )
              .join("")}
          </div>
        </div>
      `)
      .join("");

    currentItems.forEach((_, i) => {
      const checkbox = document.getElementById(`check-${i}`);
      const row = document.getElementById(`item-${i}`);
      checkbox.addEventListener("change", (e) => {
        row.classList.toggle("checked", e.target.checked);
      });

      const qtyInput = document.getElementById(`qty-${i}`);
      qtyInput.addEventListener("change", () => setQty(i, qtyInput.value));
      qtyInput.addEventListener("blur", () => setQty(i, qtyInput.value));
    });
  }

  function setQty(i, rawValue) {
    const n = Math.max(1, parseInt(rawValue, 10) || 1);
    quantities[i] = n;
    document.getElementById(`qty-${i}`).value = n;
  }

  function changeQty(i, delta) {
    quantities[i] = Math.max(1, (quantities[i] || 1) + delta);
    document.getElementById(`qty-${i}`).value = quantities[i];
  }

  function collectItems() {
    const items = [];
    currentItems.forEach((item, i) => {
      const checked = document.getElementById(`check-${i}`).checked;
      if (checked) {
        items.push({ name: item.name, qty: quantities[i] || 1 });
      }
    });
    return items;
  }

  async function submitOrder() {
    const errorEl = document.getElementById("errorText");
    errorEl.innerText = "";

    const items = collectItems();
    if (!items.length) {
      errorEl.innerText = "Добавьте хотя бы одну позицию";
      return;
    }

    const payload = {
      venue: venue,
      name: document.getElementById("submitterName").value.trim(),
      date: dateInput.value,
      items: items,
      comment: document.getElementById("comment").value || "",
    };

    const submitBtn = document.getElementById("submitBtn");
    submitBtn.disabled = true;
    submitBtn.innerText = "Отправляем...";

    try {
      const res = await fetch("/api/oko-order/submit", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        errorEl.innerText = data.error || "Не удалось отправить заказ";
        submitBtn.disabled = false;
        submitBtn.innerText = "Отправить заказ";
        return;
      }
      document.getElementById("formScreen").style.display = "none";
      document.getElementById("doneScreen").style.display = "block";
    } catch {
      errorEl.innerText = "Нет соединения. Попробуйте ещё раз.";
      submitBtn.disabled = false;
      submitBtn.innerText = "Отправить заказ";
    }
  }

  loadItems();
</script>
</body>
</html>
