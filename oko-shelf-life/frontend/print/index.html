<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Печать этикеток</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #0d1117; color: #e6edf3; }
  button, input { font-family: inherit; }

  #nameGate { max-width: 360px; margin: 60px auto; padding: 0 20px; }
  #nameGate h2 { margin: 0 0 6px; font-size: 19px; }
  #nameGate p { font-size: 13px; color: #8b949e; margin: 0 0 16px; }
  #nameGate input {
    width: 100%; padding: 11px 12px; background: #161b22; border: 1px solid #30363d; border-radius: 8px;
    color: #e6edf3; font-size: 15px; margin-bottom: 10px;
  }
  #nameGate button {
    width: 100%; background: #238636; color: white; border: none; border-radius: 8px; padding: 12px;
    font-size: 14px; font-weight: 700; cursor: pointer;
  }

  #app { display: none; max-width: 480px; margin: 0 auto; min-height: 100vh; flex-direction: column; }
  #app.visible { display: flex; }

  .top { padding: 16px 16px 12px; border-bottom: 1px solid #21262d; flex: none; }
  .top .title { font-size: 15px; font-weight: 700; margin-bottom: 2px; }
  .top .who { font-size: 12px; color: #8b949e; }
  .top .who button { all: unset; color: #58a6ff; cursor: pointer; font-size: 12px; }

  #search { margin: 12px 16px 10px; padding: 10px 12px; background: #161b22; border: 1px solid #30363d; border-radius: 8px; color: #e6edf3; font-size: 14px; flex: none; }

  .list { flex: 1; overflow-y: auto; padding: 0 14px 24px; display: flex; flex-direction: column; gap: 8px; }
  .item-row {
    background: #161b22; border: 1px solid #30363d; border-radius: 10px; padding: 12px 14px;
    display: flex; align-items: center; justify-content: space-between; gap: 10px; cursor: pointer; text-align: left;
  }
  .item-row:active { background: #1a2029; }
  .item-name { font-size: 14px; font-weight: 600; }
  .item-term { font-size: 11.5px; color: #8b949e; margin-top: 2px; }
  .item-term.unparsed { color: #d29922; }
  .item-chev { color: #8b949e; flex: none; }
  .empty { text-align: center; color: #8b949e; font-size: 13px; padding: 30px 0; }

  .modal-overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0); opacity: 0; pointer-events: none;
    align-items: flex-end; justify-content: center; z-index: 50; transition: opacity 0.15s;
  }
  .modal-overlay.open { display: flex; background: rgba(0,0,0,0.6); opacity: 1; pointer-events: auto; }
  .sheet {
    background: #161b22; border: 1px solid #30363d; border-radius: 16px 16px 0 0; padding: 20px 18px calc(20px + env(safe-area-inset-bottom));
    width: 100%; max-width: 480px; transform: translateY(8px); transition: transform 0.15s;
  }
  .modal-overlay.open .sheet { transform: translateY(0); }
  .sheet-name { font-size: 17px; font-weight: 800; margin-bottom: 4px; }
  .sheet-term { font-size: 13px; color: #8b949e; margin-bottom: 18px; }
  .sheet-actions { display: flex; flex-direction: column; gap: 10px; }
  .sheet-actions button {
    all: unset; text-align: center; padding: 14px; border-radius: 10px; font-size: 15px; font-weight: 700; cursor: pointer;
  }
  .btn-defrost { background: #21262d; border: 1px solid #30363d; color: #e6edf3; }
  .btn-freeze { background: #0c3654; border: 1px solid #1a5686; color: #79c0ff; }
  .sheet-cancel { all: unset; display: block; text-align: center; color: #8b949e; font-size: 13px; padding: 12px; cursor: pointer; }

  .confirm-box { text-align: center; padding: 10px 0 4px; }
  .confirm-icon { font-size: 34px; margin-bottom: 8px; }
  .confirm-title { font-size: 16px; font-weight: 700; margin-bottom: 6px; }
  .confirm-sub { font-size: 13px; color: #8b949e; }
  .confirm-sub b { color: #e6edf3; }
  .confirm-note { font-size: 11.5px; color: #d29922; margin-top: 8px; }
</style>
</head>
<body>

<div id="nameGate">
  <h2>Печать этикеток</h2>
  <p>Представьтесь — чтобы на этикетке было видно, кто разморозил/заморозил.</p>
  <input type="text" id="nameInput" placeholder="Ваше имя" onkeydown="if(event.key==='Enter') startApp()">
  <button onclick="startApp()">Начать</button>
</div>

<div id="app">
  <div class="top">
    <div class="title">Печать этикеток</div>
    <div class="who">Вы: <b id="whoName"></b> · <button onclick="resetName()">не я</button></div>
  </div>
  <input type="search" id="search" placeholder="Поиск заготовки..." oninput="render()">
  <div class="list" id="list"></div>
</div>

<div class="modal-overlay" id="sheetOverlay" onclick="if(event.target===this) closeSheet()">
  <div class="sheet" id="sheetBody"></div>
</div>

<script>
  const API = "/api/oko-shelf-life-print";
  let cookName = localStorage.getItem("oko_sl_print_name") || "";
  let items = [];
  let activeItem = null;

  function startApp() {
    const name = document.getElementById("nameInput").value.trim();
    if (!name) return;
    cookName = name;
    localStorage.setItem("oko_sl_print_name", name);
    boot();
  }

  function resetName() {
    localStorage.removeItem("oko_sl_print_name");
    cookName = "";
    document.getElementById("app").classList.remove("visible");
    document.getElementById("nameGate").style.display = "block";
    document.getElementById("nameInput").value = "";
  }

  async function boot() {
    document.getElementById("nameGate").style.display = "none";
    document.getElementById("app").classList.add("visible");
    document.getElementById("whoName").innerText = cookName;
    await load();
  }

  async function load() {
    const res = await fetch(`${API}/items`);
    if (!res.ok) return;
    items = await res.json();
    render();
  }

  function escapeHtml(value) {
    return String(value ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  function render() {
    const q = (document.getElementById("search").value || "").trim().toLowerCase();
    const filtered = q ? items.filter((it) => it.name.toLowerCase().includes(q)) : items;
    const list = document.getElementById("list");
    if (!filtered.length) {
      list.innerHTML = `<div class="empty">Ничего не найдено</div>`;
      return;
    }
    list.innerHTML = filtered
      .map(
        (it) => `
      <button class="item-row" onclick="openSheet('${it.id}')">
        <div>
          <div class="item-name">${escapeHtml(it.name)}</div>
          <div class="item-term ${it.shelfLifeHours == null ? "unparsed" : ""}">${escapeHtml(it.shelfLifeText) || "срок не указан"}</div>
        </div>
        <div class="item-chev">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
        </div>
      </button>`,
      )
      .join("");
  }

  function openSheet(itemId) {
    activeItem = items.find((it) => it.id === itemId);
    if (!activeItem) return;
    document.getElementById("sheetBody").innerHTML = `
      <div class="sheet-name">${escapeHtml(activeItem.name)}</div>
      <div class="sheet-term">Срок хранения: ${escapeHtml(activeItem.shelfLifeText) || "не указан"}</div>
      <div class="sheet-actions">
        <button class="btn-freeze" onclick="submitAction('заморозка')">❄️ Заморозил</button>
        <button class="btn-defrost" onclick="submitAction('разморозка')">🧊 Разморозил</button>
      </div>
      <button class="sheet-cancel" onclick="closeSheet()">Отмена</button>
    `;
    document.getElementById("sheetOverlay").classList.add("open");
  }
  function closeSheet() {
    document.getElementById("sheetOverlay").classList.remove("open");
    activeItem = null;
  }

  function formatDateTime(ts) {
    if (!ts) return null;
    const d = new Date(ts);
    const pad = (n) => String(n).padStart(2, "0");
    return `${pad(d.getDate())}.${pad(d.getMonth() + 1)}.${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }

  async function submitAction(action) {
    if (!activeItem) return;
    const item = activeItem;
    const res = await fetch(`${API}/jobs`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ itemId: item.id, action, by: cookName }),
    });
    if (!res.ok) {
      const data = await res.json().catch(() => ({}));
      document.getElementById("sheetBody").innerHTML = `<div class="confirm-box"><div class="confirm-icon">⚠️</div><div class="confirm-title">Не удалось отправить на печать</div><div class="confirm-sub">${escapeHtml(data.error || "Попробуйте ещё раз")}</div></div><button class="sheet-cancel" onclick="closeSheet()">Закрыть</button>`;
      return;
    }
    const job = await res.json();
    const expiresText = job.expiresAt ? `Годен до: <b>${formatDateTime(job.expiresAt)}</b>` : "";
    document.getElementById("sheetBody").innerHTML = `
      <div class="confirm-box">
        <div class="confirm-icon">🖨️</div>
        <div class="confirm-title">Отправлено на печать</div>
        <div class="confirm-sub">${expiresText}</div>
        ${job.expiresAt ? "" : '<div class="confirm-note">Срок хранения для этой позиции не задан в справочнике — впишите дату вручную на этикетке.</div>'}
      </div>
      <button class="sheet-cancel" onclick="closeSheet()">Готово</button>
    `;
  }

  if (cookName) boot();
</script>

</body>
</html>
